name: Workflow Validation

on:
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-validation
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    name: Validate GitHub Workflows

    runs-on:
      - self-hosted
      - rclone-bisync

    timeout-minutes: 10

    env:
      GOTOOLCHAIN: local
      ACTIONLINT_VERSION: "latest"
      ACTIONLINT_RUNNER_LABELS: "rclone-bisync"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Show environment
        run: |
          command -v go
          go version

          go env GOVERSION
          go env GOOS
          go env GOARCH
          go env GOTOOLCHAIN

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}

      - name: Verify actionlint installation
        run: |
          actionlint -version

      - name: Validate workflows
        run: |
          actionlint \
            -self-hosted-runner-labels "${ACTIONLINT_RUNNER_LABELS}"
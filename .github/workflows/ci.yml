name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.js"
      - "**/*.html"
      - "go.mod"
      - "go.sum"
      - "scripts/*.sh"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.js"
      - "**/*.html"
      - "go.mod"
      - "go.sum"
      - "scripts/*.sh"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quality-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Code Formatting & Shells
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run Formatting Check
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh fmt

  lint:
    name: Static Analysis & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Install Analysis Tools
        run: |
          sudo apt-get update && sudo apt-get install -y tidy
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/betterleaks/betterleaks@latest

      - name: Run Static Analysis & Secret Scan
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh lint

  templates:
    name: Alpine Template Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Alpine Template Safety Check
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh templates

  loc:
    name: Lines of Code Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run LOC Audit
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh loc

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MIN_COVERAGE: "80.0"
      COVERAGE_FILE: coverage.out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run Unit Tests
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh test

  build:
    name: Cross Builds & CLI Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run Build Verification
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh build

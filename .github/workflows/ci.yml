name: CI Quality Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on:
      - self-hosted
      - rclone-bisync

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Display runner information
        run: |
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "Architecture: $(uname -m)"
          go version

      - name: Verify Go modules
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run Quality Gate
        run: |
          chmod +x ./scripts/check.sh
          ./scripts/check.sh

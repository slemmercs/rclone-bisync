name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Pre-Flight Quality Gate
        run: |
          chmod +x ./scripts/check.sh
          ./scripts/check.sh

      - name: Build Single-Binary Executable
        run: |
          go build -v -o bin/rclone-bisync main.go

      - name: Verify Executable CLI
        run: |
          ./bin/rclone-bisync --help

name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.js"
      - "go.mod"
      - "go.sum"
      - "scripts/*.sh"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.js"
      - "go.mod"
      - "go.sum"
      - "scripts/*.sh"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quality-gate
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Code Formatting & Shells
    runs-on:
      - self-hosted
      - rclone-bisync
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Run Formatting Check
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh fmt

  lint:
    name: Static Analysis & Security
    runs-on:
      - self-hosted
      - rclone-bisync
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Run Static Analysis
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh lint

  test:
    name: Unit Tests & Coverage
    runs-on:
      - self-hosted
      - rclone-bisync
    timeout-minutes: 15

    env:
      MIN_COVERAGE: "80.0"
      COVERAGE_FILE: coverage.out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Run Unit Tests
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh test

  build:
    name: Cross Builds & CLI Check
    runs-on:
      - self-hosted
      - rclone-bisync
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Run Build Verification
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh build
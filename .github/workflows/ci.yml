name: CI Quality Gate

on:
  pull_request:
    branches:
      - main

    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

      - "scripts/check.sh"

      - ".github/workflows/ci.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/nightly-quality.yml"

  push:
    branches:
      - main

    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

      - "scripts/check.sh"

      - ".github/workflows/ci.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/nightly-quality.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quality-gate
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality-gate:
    name: CI Quality Gate

    runs-on:
      - self-hosted
      - rclone-bisync

    timeout-minutes: 15

    env:
      MIN_COVERAGE: "80.0"
      COVERAGE_FILE: coverage.out

      GOFLAGS: "-mod=readonly"
      GOTOOLCHAIN: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Show environment
        run: |
          command -v go
          go version

          go env GOVERSION
          go env GOOS
          go env GOARCH
          go env GOFLAGS
          go env GOTOOLCHAIN

      - name: Run Quality Gate
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh
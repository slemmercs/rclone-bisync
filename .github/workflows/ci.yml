name: CI Quality Gate

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on:
      - self-hosted
      - rclone-bisync

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Quality Gate
        env:
          MIN_COVERAGE: "80.0"
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh

name: Markdown Lint

on:
  pull_request:
    paths:
      - "**/*.md"

  push:
    branches:
      - main
    paths:
      - "**/*.md"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-lint
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown Lint

    runs-on:
      - self-hosted
      - rclone-bisync

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
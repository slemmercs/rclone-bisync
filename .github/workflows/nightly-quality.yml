name: Nightly Deep Quality & Security

on:
  schedule:
    # Daily at 01:17 UTC
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Code Formatting & Shell Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run Formatting Check
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh fmt

  security-and-lint:
    name: Static Analysis & Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOFLAGS: "-mod=readonly"
      GOTOOLCHAIN: local

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Install Analysis & Security Tools
        run: |
          sudo apt-get update && sudo apt-get install -y tidy
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/betterleaks/betterleaks@latest

      - name: Run Static Analysis & Betterleaks
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh lint

  templates:
    name: Alpine Template Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Alpine Template Safety Check
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh templates

  loc:
    name: Lines of Code Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run LOC Audit
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh loc

  test:
    name: Deep Unit Tests & Race Detection
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GOFLAGS: "-mod=readonly"
      GOTOOLCHAIN: local
      MIN_COVERAGE: "85.0"
      RUN_RACE: "true"
      COVERAGE_FILE: "coverage.out"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Execute Deep Unit Tests
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh test

      - name: Upload Coverage Report
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Cross-Platform Builds & CLI Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Run Build Verification
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh build
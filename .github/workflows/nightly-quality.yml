name: Nightly Deep Quality Gate

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:
    inputs:
      branch:
        description: Branch to validate
        required: true
        default: main

jobs:
  nightly:
    runs-on:
      - self-hosted
      - rclone-bisync

    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false

      - name: Install Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: |
          staticcheck ./...

      - name: Race Detector
        run: |
          CGO_ENABLED=1 go test \
            -race \
            -count=1 \
            ./...

      - name: Extended Coverage
        env:
          MIN_COVERAGE: "85.0"
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh

name: Nightly Deep Quality Gate

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly Deep Validation

    runs-on:
      - self-hosted
      - rclone-bisync

    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false

      - name: Show environment
        run: |
          which go
          go version
          go env GOVERSION
          go env GOOS
          go env GOARCH

      - name: Install Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run Staticcheck
        run: |
          staticcheck ./...

      - name: Run Race Detector
        run: |
          CGO_ENABLED=1 go test \
            -race \
            -count=1 \
            ./...

      - name: Run Extended Quality Gate
        env:
          MIN_COVERAGE: "85.0"
        run: |
          chmod +x scripts/check.sh
          ./scripts/check.sh
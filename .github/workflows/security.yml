name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

  schedule:
    - cron: "0 2 * * 0"

jobs:
  govulncheck:
    runs-on:
      - self-hosted
      - rclone-bisync

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./...

name: Security Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  betterleaks:
    name: Betterleaks Secret Scan
    runs-on:
      - self-hosted
      - rclone-bisync
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Ensure Betterleaks Installed
        run: |
          export PATH="$HOME/go/bin:$GOPATH/bin:$PATH"
          if ! command -v betterleaks &> /dev/null; then
            go install github.com/betterleaks/betterleaks@latest
          fi

      - name: Run Betterleaks Scan
        run: |
          export PATH="$HOME/go/bin:$GOPATH/bin:$PATH"
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            betterleaks git -v --config .betterleaks.toml --log-opts="origin/${{ github.base_ref || 'main' }}..HEAD"
          else
            betterleaks dir -v --config .betterleaks.toml .
          fi

  govulncheck:
    name: Go Vulnerability Scan
    runs-on:
      - self-hosted
      - rclone-bisync
    timeout-minutes: 15

    env:
      GOTOOLCHAIN: local
      GOVULNCHECK_VERSION: "v1.9.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Run govulncheck
        run: |
          govulncheck ./...

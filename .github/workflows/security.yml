name: Security Scan

on:
  pull_request:

  push:
    branches:
      - main

  schedule:
    - cron: "0 2 * * 0"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Scan

    runs-on:
      - self-hosted
      - rclone-bisync

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Show environment
        run: |
          which go
          go version
          go env GOVERSION
          go env GOOS
          go env GOARCH

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./...

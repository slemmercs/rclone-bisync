name: Security Scan

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

      - ".github/workflows/ci.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/nightly-quality.yml"

      - "scripts/check.sh"

  push:
    branches:
      - main

    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

      - ".github/workflows/ci.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/nightly-quality.yml"

      - "scripts/check.sh"

  schedule:
    - cron: "0 2 * * 0"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  govulncheck:
    name: Go Vulnerability Scan

    runs-on:
      - self-hosted
      - rclone-bisync

    timeout-minutes: 15

    env:
      GOTOOLCHAIN: local
      GOVULNCHECK_VERSION: "v1.9.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false

      - name: Show environment
        run: |
          command -v go
          go version

          go env GOVERSION
          go env GOOS
          go env GOARCH
          go env GOTOOLCHAIN
          go env GOPATH
          go env GOBIN

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Run govulncheck
        run: |
          govulncheck ./...
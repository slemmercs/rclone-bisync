{{ define "component_context_menu" }}
<!-- Floating File Context Menu -->
<div x-show="contextMenu.show" x-cloak @click.outside="closeContextMenu()" :style="'top: ' + contextMenu.y + 'px; left: ' + contextMenu.x + 'px;'" class="fixed z-50 min-w-[12rem] bg-slate-900 border border-slate-700/80 rounded-xl shadow-2xl py-1 text-xs text-slate-200 font-sans backdrop-blur-md">
    <div class="px-3 py-1.5 border-b border-slate-800 text-[10px] font-mono text-slate-400 truncate max-w-[14rem]" x-text="contextMenu.item ? contextMenu.item.Name : ''"></div>
    <template x-if="contextMenu.item && getReviewCandidate(contextMenu.paneKey, contextMenu.item)">
        <div class="border-b border-slate-800 pb-1 mb-1 px-1">
            <div class="px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-amber-400 flex items-center justify-between">
                <span>Remediation</span>
                <span class="text-[9px] font-mono text-slate-400" x-text="getReviewCandidate(contextMenu.paneKey, contextMenu.item)?.decision || 'pending'"></span>
            </div>
            <template x-if="getReviewCandidate(contextMenu.paneKey, contextMenu.item)?.type === 'conflict'">
                <div class="space-y-0.5">
                    <button type="button" @click="stageReviewDecision(getReviewCandidate(contextMenu.paneKey, contextMenu.item).id, 'keep-local'); closeContextMenu()" class="w-full px-2 py-1 text-left hover:bg-indigo-950/50 rounded flex items-center justify-between text-indigo-300 hover:text-white transition-colors cursor-pointer">
                        <span>Keep Local</span>
                        <span class="text-[9px] font-mono text-slate-400">local &gt; remote</span>
                    </button>
                    <button type="button" @click="stageReviewDecision(getReviewCandidate(contextMenu.paneKey, contextMenu.item).id, 'keep-remote'); closeContextMenu()" class="w-full px-2 py-1 text-left hover:bg-indigo-950/50 rounded flex items-center justify-between text-indigo-300 hover:text-white transition-colors cursor-pointer">
                        <span>Keep Remote</span>
                        <span class="text-[9px] font-mono text-slate-400">remote &gt; local</span>
                    </button>
                    <button type="button" @click="stageReviewDecision(getReviewCandidate(contextMenu.paneKey, contextMenu.item).id, 'keep-both'); closeContextMenu()" class="w-full px-2 py-1 text-left hover:bg-indigo-950/50 rounded flex items-center justify-between text-indigo-300 hover:text-white transition-colors cursor-pointer">
                        <span>Keep Both</span>
                        <span class="text-[9px] font-mono text-slate-400">suffix copy</span>
                    </button>
                </div>
            </template>
            <template x-if="getReviewCandidate(contextMenu.paneKey, contextMenu.item)?.type === 'deletion'">
                <div class="space-y-0.5">
                    <button type="button" @click="stageReviewDecision(getReviewCandidate(contextMenu.paneKey, contextMenu.item).id, 'accept-delete'); closeContextMenu()" class="w-full px-2 py-1 text-left hover:bg-rose-950/50 rounded flex items-center justify-between text-rose-300 hover:text-rose-200 transition-colors cursor-pointer">
                        <span>Accept Delete</span>
                        <span class="text-[9px] font-mono text-rose-400">purge file</span>
                    </button>
                    <button type="button" @click="stageReviewDecision(getReviewCandidate(contextMenu.paneKey, contextMenu.item).id, 'restore-item'); closeContextMenu()" class="w-full px-2 py-1 text-left hover:bg-emerald-950/50 rounded flex items-center justify-between text-emerald-300 hover:text-emerald-200 transition-colors cursor-pointer">
                        <span>Restore Item</span>
                        <span class="text-[9px] font-mono text-emerald-400">un-delete</span>
                    </button>
                </div>
            </template>
        </div>
    </template>

    <template x-if="contextMenu.item && isItemPreviewable(contextMenu.item)">
        <button type="button" @click="previewFile(contextMenu.paneKey, contextMenu.item); closeContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-slate-800 flex items-center gap-2 text-slate-200 hover:text-white transition-colors cursor-pointer">
            <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>Preview</span>
        </button>
    </template>
    <template x-if="contextMenu.item && !contextMenu.item.IsDir">
        <button type="button" @click="downloadFile(contextMenu.paneKey, contextMenu.item); closeContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-slate-800 flex items-center gap-2 text-slate-200 hover:text-white transition-colors cursor-pointer">
            <svg class="w-3.5 h-3.5 text-emerald-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            <span>Download</span>
        </button>
    </template>
    <template x-if="contextMenu.item">
        <button type="button" @click="transferItem(contextMenu.paneKey, contextMenu.item); closeContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-slate-800 flex items-center gap-2 text-slate-200 hover:text-white transition-colors cursor-pointer">
            <svg x-show="contextMenu.paneKey === 'left'" class="w-3.5 h-3.5 text-sky-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            <svg x-show="contextMenu.paneKey !== 'left'" class="w-3.5 h-3.5 text-sky-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span x-text="contextMenu.paneKey === 'left' ? 'Copy to Remote' : 'Copy to Local'"></span>
        </button>
    </template>
    <button type="button" @click="copyItemPath(contextMenu.item); closeContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-slate-800 flex items-center gap-2 text-slate-200 hover:text-white transition-colors cursor-pointer">
        <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span>Copy Path</span>
    </button>
    <template x-if="contextMenu.item && contextMenu.paneKey && explorer[contextMenu.paneKey].target !== 'local'">
        <button type="button" @click="openOnRemote(contextMenu.paneKey, contextMenu.item); closeContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-slate-800 flex items-center gap-2 text-slate-200 hover:text-white transition-colors cursor-pointer">
            <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
            <span>Open on Remote</span>
        </button>
    </template>
    <template x-if="contextMenu.item && !isCanaryItem(contextMenu.item)">
        <button type="button" @click="promptMoveItem(contextMenu.paneKey, contextMenu.item); closeContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-slate-800 flex items-center gap-2 text-slate-200 hover:text-white transition-colors cursor-pointer">
            <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <span>Move / Rename</span>
        </button>
    </template>
    <template x-if="contextMenu.item && contextMenu.item.IsDir && !isCanaryItem(contextMenu.item)">
        <button type="button" @click="promptPurgeDirectory(contextMenu.paneKey, contextMenu.item); closeContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-rose-500/20 flex items-center gap-2 text-rose-300 hover:text-rose-200 transition-colors cursor-pointer">
            <svg class="w-3.5 h-3.5 text-rose-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="m10 11 4 6"/><path d="m14 11-4 6"/></svg>
            <span>Purge Directory</span>
        </button>
    </template>
    <template x-if="contextMenu.item && !isCanaryItem(contextMenu.item)">
        <div class="border-t border-slate-800 pt-1 mt-1">
            <button type="button" @click="promptDeleteItem(contextMenu.paneKey, contextMenu.item); closeContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-rose-500/20 flex items-center gap-2 text-rose-400 hover:text-rose-300 transition-colors cursor-pointer">
                <svg class="w-3.5 h-3.5 text-rose-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                <span>Delete</span>
            </button>
        </div>
    </template>
</div>
{{ end }}

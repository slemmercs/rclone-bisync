{{ define "component_explorer_toolbar" }}
<!-- Explorer Cockpit Subheader Toolbar -->
<div class="sticky top-2 z-20 space-y-2">
    <div class="bg-slate-900/90 backdrop-blur-md border border-slate-800 p-2.5 rounded-xl flex flex-wrap items-center justify-between gap-3 shadow-lg shadow-slate-950/40">
        <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg>
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-200">Dual-Pane Directory Explorer</span>
            <span class="text-[10px] px-2 py-0.5 rounded font-mono bg-slate-800 text-slate-400 border border-slate-700/60 hidden sm:inline-block" x-text="explorer.isSwapped ? 'Remote ⇄ Local' : 'Local ⇄ Remote'"></span>
            <template x-if="activeProfile">
                <div class="flex items-center gap-1.5 px-2 py-0.5 bg-indigo-950/60 border border-indigo-700/50 rounded-lg text-xs">
                    <span class="text-[10px] text-slate-400">Profile:</span>
                    <span class="text-indigo-300 font-semibold truncate max-w-[8rem]" x-text="activeProfile.name"></span>
                    <span class="text-[10px] font-mono text-indigo-400 hidden xl:inline-block truncate max-w-[12rem]" x-text="'(' + (activeProfile.local_path || 'local') + ' ⇄ ' + (activeProfile.remote || '') + (activeProfile.remote_path ? '/' + activeProfile.remote_path : '') + ')'"></span>
                    <button @click="openProfilesModal('list')" class="text-[10px] text-indigo-400 hover:text-white underline ml-0.5">Switch</button>
                </div>
            </template>
        </div>

    <div class="flex flex-wrap items-center gap-2">
        <button @click="openUploadDockModal()" class="px-2.5 py-1 bg-slate-950/80 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5" :title="'Upload Dock: ' + (uploadDock.pending_count || 0) + ' pending'">
            <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            <span>Uploads:</span>
            <span class="font-mono text-indigo-300 font-bold" x-text="uploadDock.pending_count || 0"></span>
            <span x-show="uploadDock.is_sync_active" class="px-1 py-0.2 rounded text-[9px] bg-amber-500/20 text-amber-300 border border-amber-500/30 uppercase tracking-wider font-bold">Mid-Sync</span>
        </button>
        <div class="flex items-center gap-1.5 bg-slate-950/80 border border-slate-800 px-2 py-1 rounded-lg text-xs">
            <span class="text-[11px] text-slate-400 font-sans">Delete Safety:</span>
            <select x-model="deleteConfirmMode" @change="setDeleteConfirmMode(deleteConfirmMode)" class="bg-slate-900 border border-slate-700/80 rounded px-1.5 py-0.5 text-xs text-white focus:outline-none focus:border-indigo-500 font-medium">
                <option value="double">Double Confirmation (Default)</option>
                <option value="single">Single Confirmation</option>
                <option value="none">Direct (No Confirmation)</option>
            </select>
        </div>
        <button @click="swapExplorerPanes()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5 border border-slate-700/60 cursor-pointer" title="Swap Left and Right Panes (⇄)">
            <span class="text-sm font-bold">⇄</span><span>Swap Panes</span>
        </button>
        <button @click="syncCurrentDirectory('left')" :disabled="isExplorerLoading()" class="px-2.5 py-1 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5 border border-indigo-500/30 cursor-pointer" title="Transfer current local directory contents to remote">
            <svg class="w-3.5 h-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg><span>Transfer to Remote →</span>
        </button>
        <button @click="syncCurrentDirectory('right')" :disabled="isExplorerLoading()" class="px-2.5 py-1 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5 border border-emerald-500/30 cursor-pointer" title="Transfer current remote directory contents to local">
            <svg class="w-3.5 h-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span>Transfer to Local ←</span>
        </button>
        <button @click="refreshExplorer()" :disabled="isExplorerLoading()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-200 rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5 border border-slate-700/60">
            <svg class="w-3.5 h-3.5 shrink-0" :class="{ 'animate-spin': isExplorerLoading() }" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            <span>Refresh</span>
        </button>
        <button @click="toggleLogDock()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5 border border-slate-700/60 cursor-pointer" :class="logDock.open ? 'border-indigo-500/60 text-indigo-300 bg-indigo-950/40' : ''" :title="logDock.open ? 'Hide Log Dock' : 'Open Pinned Log Dock'">
            <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
            <span>Log Dock</span>
            <span class="px-1.5 py-0.2 rounded text-[10px] font-mono bg-slate-900 border border-slate-700/80 text-slate-400" x-text="getFilteredDockLogs().length"></span>
        </button>
        <button x-show="reviewState.active" @click="openReviewModal()" class="px-2.5 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5 border border-amber-500/40 animate-pulse cursor-pointer" title="Open Review & Resolution Center">
            <svg class="w-3.5 h-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
            <span x-text="`Review Active (${reviewStats.total})`"></span>
        </button>
    </div>
</div>

<!-- Active Remediation Cockpit Banner -->
<template x-if="remediationCandidate">
    <div class="bg-amber-950/70 border border-amber-600/50 rounded-xl px-4 py-2 flex items-center justify-between gap-3 text-xs text-amber-200 shadow-md">
        <div class="flex items-center gap-2.5 min-w-0">
            <span class="px-2 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-300 font-bold uppercase tracking-wider border border-amber-500/30">Remediation Triage</span>
            <span class="text-slate-300 truncate">Inspecting Conflict: <strong class="text-amber-300 font-mono" x-text="remediationCandidate.Path || remediationCandidate.file_path || ''"></strong></span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button @click="openReviewModal()" class="px-2.5 py-1 bg-amber-600/30 hover:bg-amber-600/50 text-amber-200 rounded-lg text-xs font-medium transition-colors">Return to Review</button>
            <button @click="clearRemediationCandidate()" class="text-slate-400 hover:text-white text-xs px-1.5 py-0.5">Dismiss</button>
        </div>
    </div>
</template>
</div>
{{ end }}

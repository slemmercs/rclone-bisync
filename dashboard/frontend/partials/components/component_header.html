{{/* Bandwidth Controller Header Popover Component */}}
{{ define "component_header_bandwidth" }}
<div class="relative" @click.outside="closeBandwidthPopover()">
    <!-- Trigger Button in Header Tier 1 -->
    <button @click="toggleBandwidthPopover()" type="button" class="flex items-center gap-2 bg-slate-900 border border-slate-800 hover:border-slate-700/80 px-2.5 py-1.5 rounded-xl font-mono text-xs transition-colors cursor-pointer group" title="Bandwidth throttling & real-time transfer statistics">
        <span class="relative flex h-2 w-2">
            <span x-show="bandwidth.speed > 0 || (bandwidth.transferring && bandwidth.transferring.length > 0)" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2" :class="bandwidth.speed > 0 ? 'bg-indigo-400' : 'bg-slate-600'"></span>
        </span>
        <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0 group-hover:scale-110 transition-transform" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m17 5-5-3-5 3"/><path d="m17 19-5 3-5-3"/></svg>
        <span class="font-semibold text-white text-[11px]" x-text="formatSpeed(bandwidth.speed)"></span>
        <span class="text-slate-600">|</span>
        <span class="text-[10px] px-1.5 py-0.2 rounded font-bold uppercase shrink-0" :class="bandwidth.currentLimit !== 'off' && bandwidth.currentLimit !== '' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-800 text-slate-400 border border-slate-700'" x-text="bandwidth.currentLimit !== 'off' && bandwidth.currentLimit !== '' ? ('Limit: ' + bandwidth.rateFormatted) : 'Unlimited'"></span>
    </button>

    <!-- Popover Panel -->
    <div x-show="isBandwidthPopoverOpen()" x-cloak x-transition.opacity.duration.150ms class="absolute right-0 mt-2 w-80 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl z-50 overflow-hidden text-xs text-slate-300 font-sans text-left">
        <div class="p-3 bg-slate-950/70 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                    <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m17 5-5-3-5 3"/><path d="m17 19-5 3-5-3"/></svg>
                </div>
                <span class="font-bold text-white uppercase text-[11px] tracking-wider">Bandwidth Control</span>
            </div>
            <button @click="closeBandwidthPopover()" class="text-slate-500 hover:text-white p-1 rounded-lg transition-colors cursor-pointer" title="Close">
                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <div class="p-3.5 space-y-3">
            <div class="grid grid-cols-2 gap-2 text-[11px] font-mono">
                <div class="bg-slate-950/60 p-2 rounded-xl border border-slate-800/80">
                    <div class="text-[9px] uppercase font-bold text-slate-500">Speed</div>
                    <div class="text-white font-semibold mt-0.5" x-text="formatSpeed(bandwidth.speed)"></div>
                </div>
                <div class="bg-slate-950/60 p-2 rounded-xl border border-slate-800/80">
                    <div class="text-[9px] uppercase font-bold text-slate-500">Transferred</div>
                    <div class="text-indigo-300 font-semibold mt-0.5" x-text="formatBytes(bandwidth.bytes)"></div>
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Throttle Presets</label>
                <div class="grid grid-cols-5 gap-1.5">
                    <template x-for="p in bandwidth.presets" :key="p">
                        <button type="button" @click="setBandwidthLimit(p)" :disabled="isBandwidthUpdating()" class="py-1 px-1.5 rounded-lg text-[10px] font-mono font-semibold transition-all border text-center cursor-pointer" :class="(bandwidth.currentLimit === p || (p === 'off' && bandwidth.currentLimit === '')) ? 'bg-indigo-600 text-white border-indigo-500 shadow-sm' : 'bg-slate-950 hover:bg-slate-800 text-slate-300 border-slate-800 hover:border-slate-700'" x-text="p === 'off' ? 'Max' : p"></button>
                    </template>
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Custom Rate Limit</label>
                <form @submit.prevent="applyCustomBandwidthLimit()" class="flex items-center gap-1.5">
                    <input type="text" x-model="bandwidth.customInput" placeholder="e.g. 15M, 250k, off" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white font-mono placeholder:text-slate-600">
                    <button type="submit" :disabled="isBandwidthUpdating()" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shrink-0 transition-colors cursor-pointer shadow-sm">
                        Apply
                    </button>
                </form>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Active Transfers</span>
                    <span class="text-[10px] font-mono text-slate-500" x-text="(bandwidth.transferring ? bandwidth.transferring.length : 0) + ' active'"></span>
                </div>
                <template x-if="!bandwidth.transferring || bandwidth.transferring.length === 0">
                    <div class="p-2.5 bg-slate-950/40 border border-slate-800/60 rounded-xl text-center text-[11px] text-slate-500 font-sans italic">
                        No active background transfers.
                    </div>
                </template>
                <template x-if="bandwidth.transferring && bandwidth.transferring.length > 0">
                    <div class="max-h-36 overflow-y-auto space-y-2 pr-1">
                        <template x-for="item in bandwidth.transferring" :key="item.name">
                            <div class="p-2 bg-slate-950/60 border border-slate-800/80 rounded-xl space-y-1">
                                <div class="flex items-center justify-between gap-2 text-[10px] font-mono">
                                    <span class="text-white truncate font-medium" x-text="item.name"></span>
                                    <span class="text-indigo-400 font-semibold shrink-0" x-text="(item.percentage || 0) + '%'"></span>
                                </div>
                                <div class="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                                    <div class="bg-indigo-500 h-full rounded-full transition-all duration-300" :style="'width: ' + (item.percentage || 0) + '%'"></div>
                                </div>
                                <div class="flex items-center justify-between text-[9px] text-slate-500 font-mono">
                                    <span x-text="formatBytes(item.bytes) + ' / ' + formatBytes(item.size)"></span>
                                    <span x-show="item.speed" x-text="formatSpeed(item.speed)"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
{{ end }}

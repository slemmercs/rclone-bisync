{{ define "component_log_dock" }}
<!-- Collapsible Pinned Log Audit Dock for Dual-Pane Explorer -->
<div x-show="logDock.open" x-cloak
     class="rounded-xl border border-slate-800 bg-slate-900/95 backdrop-blur-md shadow-2xl flex flex-col overflow-hidden transition-all duration-200"
     :class="{
         'h-10': logDock.heightPreset === 'collapsed',
         'h-64': logDock.heightPreset === 'docked',
         'h-96': logDock.heightPreset === 'expanded'
     }">
    <!-- Dock Header Toolbar -->
    <div class="px-3 py-1.5 bg-slate-950/80 border-b border-slate-800 flex items-center justify-between gap-3 shrink-0 select-none">
        <div class="flex items-center gap-2 min-w-0">
            <div class="flex items-center gap-1.5 text-xs font-semibold text-slate-200">
                <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                <span class="truncate">Live Sync Log Dock</span>
            </div>
            <!-- Count Badge -->
            <span class="px-1.5 py-0.2 rounded text-[10px] font-mono bg-slate-800 text-slate-400 border border-slate-700/60" x-text="getFilteredDockLogs().length + ' entries'"></span>
            <!-- Pagination Controls if total pages > 1 -->
            <div class="flex items-center gap-1 text-[10px] font-mono bg-slate-900 border border-slate-800 rounded px-1.5 py-0.5" x-show="(typeof getDockTotalPages === 'function' ? getDockTotalPages() : 1) > 1">
                <button type="button" @click="typeof loadDockPrevPage === 'function' && loadDockPrevPage()" :disabled="isDockPrevDisabled()" class="text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer" title="Previous page">&lt;</button>
                <span class="text-slate-400" x-text="'Page ' + (logDock.page || 1) + ' of ' + (typeof getDockTotalPages === 'function' ? getDockTotalPages() : 1)"></span>
                <button type="button" @click="typeof loadDockNextPage === 'function' && loadDockNextPage()" :disabled="isDockNextDisabled()" class="text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer" title="Next page">&gt;</button>
            </div>
            <!-- Keyboard Hints -->
            <span class="hidden md:inline-flex items-center gap-1 text-[10px] text-slate-500 font-mono">
                <kbd class="px-1 py-0.2 bg-slate-800 text-slate-400 rounded border border-slate-700 text-[9px]">N</kbd> / <kbd class="px-1 py-0.2 bg-slate-800 text-slate-400 rounded border border-slate-700 text-[9px]">P</kbd> step
            </span>
        </div>

        <!-- Filter & Control Buttons -->
        <div class="flex items-center gap-2 shrink-0">
            <!-- Filter Pills -->
            <div class="flex items-center bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[10px] font-mono">
                <button type="button" @click="logDock.activeFilter = 'all'" :class="logDock.activeFilter === 'all' ? 'bg-indigo-600 text-white font-semibold' : 'text-slate-400 hover:text-slate-200'" class="px-2 py-0.5 rounded transition-all cursor-pointer">All</button>
                <button type="button" @click="logDock.activeFilter = 'file_ops'" :class="(logDock.activeFilter === 'file_ops' || logDock.activeFilter === 'mutations') ? 'bg-amber-600 text-white font-semibold' : 'text-slate-400 hover:text-slate-200'" class="px-2 py-0.5 rounded transition-all cursor-pointer" title="Transfers, deletes, uploads, conflicts">File Ops</button>
                <button type="button" @click="logDock.activeFilter = 'errors'" :class="logDock.activeFilter === 'errors' ? 'bg-rose-600 text-white font-semibold' : 'text-slate-400 hover:text-slate-200'" class="px-2 py-0.5 rounded transition-all cursor-pointer">Errors</button>
            </div>

            <!-- Auto-scroll Toggle -->
            <button type="button" @click="logDock.autoScroll = !logDock.autoScroll" class="px-2 py-0.5 rounded text-[10px] font-mono border transition-colors cursor-pointer" :class="logDock.autoScroll ? 'bg-indigo-950/60 text-indigo-300 border-indigo-700/50' : 'bg-slate-950/60 text-slate-500 border-slate-800'" :title="logDock.autoScroll ? 'Auto-scroll enabled' : 'Auto-scroll paused'">
                Auto-scroll
            </button>

            <!-- Stepping buttons -->
            <div class="flex items-center gap-0.5 bg-slate-950 p-0.5 rounded-lg border border-slate-800">
                <button type="button" @click="logDockStep(-1)" class="p-1 hover:bg-slate-800 text-slate-400 hover:text-white rounded cursor-pointer" title="Previous entry (P)">
                    <svg class="w-3 h-3 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
                </button>
                <button type="button" @click="logDockStep(1)" class="p-1 hover:bg-slate-800 text-slate-400 hover:text-white rounded cursor-pointer" title="Next entry (N)">
                    <svg class="w-3 h-3 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
            </div>

            <!-- Height Presets -->
            <div class="flex items-center gap-0.5 bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[10px] text-slate-400">
                <button type="button" @click="setLogDockHeight('collapsed')" class="px-1.5 py-0.5 rounded hover:text-white cursor-pointer" :class="logDock.heightPreset === 'collapsed' ? 'bg-slate-800 text-white font-bold' : ''" title="Collapse dock">_</button>
                <button type="button" @click="setLogDockHeight('docked')" class="px-1.5 py-0.5 rounded hover:text-white cursor-pointer" :class="logDock.heightPreset === 'docked' ? 'bg-slate-800 text-white font-bold' : ''" title="Standard dock height (16rem)">=</button>
                <button type="button" @click="setLogDockHeight('expanded')" class="px-1.5 py-0.5 rounded hover:text-white cursor-pointer" :class="logDock.heightPreset === 'expanded' ? 'bg-slate-800 text-white font-bold' : ''" title="Expanded dock height (24rem)">⤢</button>
            </div>

            <!-- Close Dock -->
            <button type="button" @click="toggleLogDock(false)" class="p-1 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded transition-colors cursor-pointer" title="Close dock">
                <svg class="w-3.5 h-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>

    <!-- Dock Body / Virtual Log List -->
    <div x-show="logDock.heightPreset !== 'collapsed'" class="flex-1 min-h-0 overflow-y-auto divide-y divide-slate-800/40 font-mono text-[11px] bg-slate-950/40" id="log-dock-container">
        <template x-for="(log, idx) in getFilteredDockLogs()" :key="log.id || (log.time ? log.time + '_' + idx : (log.timestamp ? log.timestamp + '_' + idx : idx))">
            <div class="px-3 py-1.5 hover:bg-slate-800/50 flex items-start justify-between gap-3 transition-colors group cursor-pointer"
                 :class="logDock.selectedIdx === idx ? 'bg-indigo-950/40 border-l-2 border-indigo-500' : ''"
                 @click="logDockSelectAndJump(log, idx)">
                <div class="flex items-start gap-2 min-w-0 flex-1">
                    <span class="text-slate-500 shrink-0 text-[10px] tabular-nums" x-text="log.time || formatDockLogTime(log.timestamp || log.start_time)"></span>
                    <!-- Level badge -->
                    <span class="px-1.5 py-0.2 rounded text-[9px] font-bold uppercase shrink-0"
                          :class="getDockLogLevelClass(log.level)"
                          x-text="(log.level || 'INFO').trim()"></span>
                    <!-- Action Badge for sync_file or action -->
                    <template x-if="log.type === 'sync_file' || log.action">
                        <span class="px-1.5 py-0.2 rounded text-[9px] font-bold uppercase shrink-0 font-mono border"
                              :class="typeof getDockActionBadgeClass === 'function' ? getDockActionBadgeClass(log) : (
                                  (log.action === 'DELETED') ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' :
                                  ((log.action === 'RENAMED' || log.action === 'MOVED') ? 'bg-purple-500/20 text-purple-300 border-purple-500/40' :
                                  'bg-emerald-500/20 text-emerald-300 border-emerald-500/40')
                              )"
                              x-text="typeof getDockActionLabel === 'function' ? getDockActionLabel(log) : (log.action || 'SYNC')"></span>
                    </template>
                    <template x-if="log.type === 'sync_overflow'">
                        <span class="px-1.5 py-0.2 rounded text-[9px] font-bold uppercase shrink-0 font-mono bg-amber-500/20 text-amber-300 border border-amber-500/40">
                            CAPPED
                        </span>
                    </template>
                    <!-- Path Chip if detected -->
                    <template x-if="getEntryPath(log) || log.object">
                        <button type="button" @click.stop="jumpToExplorerPath(log.object || getEntryPath(log), log)"
                                class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-500/20 hover:border-indigo-400 transition-colors shrink-0 max-w-[14rem] truncate font-mono cursor-pointer"
                                :title="'Jump to: ' + (log.object || getEntryPath(log))">
                            <svg class="w-2.5 h-2.5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                            <span class="truncate" x-text="log.object || getEntryPath(log)"></span>
                        </button>
                    </template>
                    <!-- Message text -->
                    <span class="text-slate-300 break-words min-w-0 flex-1 select-text" x-text="log.msg"></span>
                </div>
            </div>
        </template>
        <!-- Empty dock state -->
        <div x-show="getFilteredDockLogs().length === 0" class="p-6 text-center text-slate-500 text-xs font-sans">
            <span>No log entries match the active dock filter.</span>
        </div>
    </div>
</div>
{{ end }}

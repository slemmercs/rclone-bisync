{{ define "modal_auth_audit" }}
    <!-- OAuth Audit Trail Modal -->
    <div x-show="auditModal.show" x-cloak @keydown.escape.window="auditModal.show = false" x-transition.opacity.duration.200ms class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div @click.away="auditModal.show = false" class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 sm:p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950/60">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 shrink-0">
                        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-white">OAuth Authentication Audit Log</h3>
                        <p class="text-xs text-slate-400 mt-0.5">Recorded authentication events and credential updates</p>
                    </div>
                </div>
                <button @click="auditModal.show = false" class="text-slate-400 hover:text-slate-200 transition-colors p-1.5 rounded-lg hover:bg-slate-800">
                    <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <div class="p-4 space-y-2 overflow-y-auto flex-1 font-mono text-xs">
                <div x-show="auditModal.loading" class="text-indigo-400 animate-pulse text-center py-8">Loading audit events...</div>
                <template x-for="(evt, idx) in auditModal.events" :key="idx">
                    <div class="p-3 rounded-xl bg-slate-950 border border-slate-800/80 flex items-start justify-between gap-3 text-[11px]">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-200" x-text="evt.event"></span>
                                <span class="px-1.5 py-0.2 rounded font-mono text-[10px] bg-slate-900 border border-slate-800 text-indigo-300" x-text="evt.remote"></span>
                                <span class="px-1.5 py-0.2 rounded font-mono text-[9px] uppercase font-bold" :class="evt.status === 'success' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/40' : (evt.status === 'failed' || evt.status === 'error' ? 'bg-rose-950 text-rose-400 border border-rose-800/40' : 'bg-slate-900 text-slate-400 border border-slate-800')" x-text="evt.status"></span>
                            </div>
                            <p class="text-slate-400 font-sans text-xs" x-text="evt.details"></p>
                        </div>
                        <span class="text-slate-500 text-[10px] shrink-0" x-text="formatModTime(evt.timestamp)" :title="evt.timestamp"></span>
                    </div>
                </template>
                <div x-show="!auditModal.loading && auditModal.events.length === 0" class="text-slate-500 text-center py-8">No authentication audit events recorded yet.</div>
            </div>

            <div class="p-3 border-t border-slate-800 bg-slate-950/60 flex justify-end">
                <button @click="auditModal.show = false" class="px-4 py-1.5 bg-slate-800 text-slate-300 rounded-lg text-xs font-semibold hover:bg-slate-700 transition-colors">Close</button>
            </div>
        </div>
    </div>
{{ end }}

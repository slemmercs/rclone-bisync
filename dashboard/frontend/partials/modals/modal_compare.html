{{ define "modal_compare" }}
<!-- Cryptographic Hash & Multi-File Checksum Comparison Modal -->
<div x-show="compareState.modalOpen" x-cloak @keydown.escape.window="closeCompareModal()" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm" x-transition.opacity.duration.200ms>
    <div @click.away="closeCompareModal()" class="bg-slate-900 border border-slate-700 rounded-2xl max-w-4xl w-full p-6 shadow-2xl relative space-y-4 flex flex-col max-h-[90vh]">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3 shrink-0">
            <div class="flex items-center gap-2.5 min-w-0 flex-1">
                <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 bg-indigo-500/10 border border-indigo-500/30 text-indigo-400">
                    <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M11 18H8a2 2 0 0 1-2-2V9"/></svg>
                </div>
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2">
                        <h3 class="text-sm font-bold text-white truncate">Multi-File Checksum Comparison</h3>
                        <template x-if="compareState.response && compareState.response.algorithm">
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase tracking-wider bg-indigo-950/80 text-indigo-300 border border-indigo-700/60" x-text="'Algo: ' + compareState.response.algorithm"></span>
                        </template>
                    </div>
                    <p class="text-[11px] text-slate-400 font-sans truncate mt-0.5">Cross-backend cryptographic hash verification and equivalence clustering</p>
                </div>
            </div>
            <button @click="closeCompareModal()" class="text-slate-500 hover:text-white p-1 rounded-lg transition-colors ml-2 shrink-0 cursor-pointer" title="Close Comparison">
                <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>

        <!-- Body / Content -->
        <div class="flex-1 overflow-y-auto space-y-4 pr-1">
            <div x-show="compareState.loading" class="py-16 flex flex-col items-center justify-center gap-3 text-slate-400 text-xs">
                <svg class="w-6 h-6 animate-spin text-indigo-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                <span>Hashing files and negotiating algorithms across remotes...</span>
            </div>

            <div x-show="!compareState.loading && compareState.error" class="p-4 bg-rose-500/10 border border-rose-500/30 text-rose-300 rounded-xl text-xs font-mono">
                <span x-text="compareState.error"></span>
            </div>

            <template x-if="!compareState.loading && !compareState.error && compareState.response">
                <div class="space-y-4">
                    <div class="p-3 rounded-xl border flex items-center justify-between gap-3 text-xs" :class="compareState.response.matches ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-200' : 'bg-amber-950/40 border-amber-500/40 text-amber-200'">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="font-bold text-sm" x-text="compareState.response.matches ? '✓ Identical Checksums' : '⚠ Mismatch Detected'"></span>
                            <span class="text-[11px] opacity-90 truncate" x-text="compareState.response.matches ? ('All files match (' + (compareState.response.algorithm || 'hash').toUpperCase() + ')') : ((compareState.response.clusters ? compareState.response.clusters.length : 0) + ' distinct equivalence clusters')"></span>
                        </div>
                        <template x-if="compareState.response.algorithm === 'none'">
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-slate-800 text-slate-300 border border-slate-700 shrink-0">Size Match</span>
                        </template>
                    </div>

                    <div class="space-y-3">
                        <template x-for="(cluster, cIdx) in (compareState.response.clusters || [])" :key="'cluster_' + cIdx">
                            <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-3 space-y-2">
                                <div class="flex items-center justify-between gap-2 border-b border-slate-800/80 pb-2 text-xs">
                                    <div class="flex items-center gap-2">
                                        <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase bg-slate-800 text-slate-300 border border-slate-700" x-text="'Cluster #' + (cIdx + 1)"></span>
                                        <span class="text-slate-400 text-xs" x-text="cluster.length + ' item' + (cluster.length === 1 ? '' : 's')"></span>
                                    </div>
                                    <template x-if="getClusterItems(cluster)[0] && getClusterItems(cluster)[0].primary_hash">
                                        <div class="font-mono text-[11px] text-slate-400 truncate max-w-sm">
                                            <span class="text-indigo-400 font-semibold" x-text="(compareState.response.algorithm || 'hash').toUpperCase() + ':'"></span>
                                            <span class="text-slate-300 select-all" x-text="getClusterItems(cluster)[0].primary_hash"></span>
                                        </div>
                                    </template>
                                </div>
                                <div class="space-y-1">
                                    <template x-for="item in getClusterItems(cluster)" :key="item.remote + ':' + item.path">
                                        <div class="px-2.5 py-1.5 bg-slate-900/80 border border-slate-800/60 rounded-lg flex items-center justify-between gap-2 text-xs">
                                            <div class="flex items-center gap-2 min-w-0 flex-1">
                                                <span class="px-1.5 py-0.2 rounded text-[9px] font-mono font-bold uppercase border shrink-0" :class="item.remote === 'local' ? 'bg-indigo-950/60 text-indigo-300 border-indigo-700/60' : 'bg-emerald-950/60 text-emerald-300 border-emerald-700/60'" x-text="item.remote"></span>
                                                <span class="text-slate-200 font-medium truncate font-mono text-[11px]" x-text="item.name"></span>
                                                <span class="text-slate-500 truncate font-mono text-[10px]" x-text="'(' + item.path + ')'"></span>
                                            </div>
                                            <div class="flex items-center gap-2 shrink-0 font-mono text-[10px]">
                                                <span x-show="item.error" class="text-rose-400" x-text="item.error"></span>
                                                <span x-show="!item.error" class="text-slate-400" x-text="formatBytes(item.size)"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
        <!-- Footer -->
        <div class="border-t border-slate-800 pt-3 flex items-center justify-between gap-3 text-xs shrink-0">
            <div class="text-slate-400 text-[11px] font-mono">
                <span x-text="compareState.selectedItems.length + ' file' + (compareState.selectedItems.length === 1 ? '' : 's') + ' selected'"></span>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" @click="runChecksumComparison()" :disabled="isCompareLoading()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-200 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5 cursor-pointer">
                    <svg class="w-3.5 h-3.5 shrink-0" :class="{ 'animate-spin': compareState.loading }" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                    <span>Re-Hash</span>
                </button>
                <button type="button" @click="clearCompareSelection(); closeCompareModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition-colors cursor-pointer">
                    Clear & Close
                </button>
                <button type="button" @click="closeCompareModal()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition-colors shadow-sm cursor-pointer">
                    Done
                </button>
            </div>
        </div>
    </div>
</div>
{{ end }}

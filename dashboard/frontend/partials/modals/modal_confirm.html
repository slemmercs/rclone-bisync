{{ define "modal_confirm" }}
<!-- General Purpose Confirmation Modal -->
<div x-show="confirmModal.show" x-cloak @keydown.escape.window="cancelConfirmModal()" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm" x-transition.opacity.duration.200ms>
    <div @click.away="cancelConfirmModal()" class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl relative space-y-4">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0"
                     :class="{
                         'bg-amber-500/10 border border-amber-500/30 text-amber-400': confirmModal.icon === 'warning',
                         'bg-indigo-500/10 border border-indigo-500/30 text-indigo-400': confirmModal.icon === 'sync' || confirmModal.icon === 'copy',
                         'bg-rose-500/10 border border-rose-500/30 text-rose-400': confirmModal.icon === 'danger'
                     }">
                    <!-- Warning Icon -->
                    <template x-if="confirmModal.icon === 'warning'">
                        <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12.01" x2="12.01" y1="16" y2="16"/></svg>
                    </template>
                    <!-- Sync/Copy Icon -->
                    <template x-if="confirmModal.icon === 'sync' || confirmModal.icon === 'copy'">
                        <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                    </template>
                    <!-- Danger Icon -->
                    <template x-if="confirmModal.icon === 'danger'">
                        <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12.01" x2="12.01" y1="16" y2="16"/></svg>
                    </template>
                </div>
                <h3 class="text-sm font-bold text-white uppercase tracking-wider" x-text="confirmModal.title || 'Confirmation Required'"></h3>
            </div>
            <button @click="cancelConfirmModal()" class="text-slate-500 hover:text-white p-1 rounded-lg transition-colors">
                <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>

        <!-- Body / Message -->
        <div class="text-xs text-slate-300 leading-relaxed whitespace-pre-line bg-slate-950/50 border border-slate-800/80 rounded-xl p-3.5 font-mono" x-text="confirmModal.message"></div>

        <!-- Visual Transfer Path Preview (Directory Copy) -->
        <template x-if="confirmModal.transfer">
            <div class="p-3 bg-slate-950/90 border border-slate-800 rounded-xl space-y-2 text-xs font-mono">
                <div class="flex items-center justify-between gap-2">
                    <span class="px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-bold text-[10px] shrink-0" x-text="confirmModal.transfer.fromLabel"></span>
                    <span class="text-slate-300 truncate text-[11px] flex-1 text-right" x-text="confirmModal.transfer.fromPath" :title="confirmModal.transfer.fromPath"></span>
                </div>
                <div class="flex items-center justify-center text-slate-500 text-xs font-bold select-none">
                    <svg class="w-4 h-4 text-slate-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5 7 7-7 7"/><path d="M5 12h14"/></svg>
                </div>
                <div class="flex items-center justify-between gap-2">
                    <span class="px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-bold text-[10px] shrink-0" x-text="confirmModal.transfer.toLabel"></span>
                    <span class="text-slate-300 truncate text-[11px] flex-1 text-right" x-text="confirmModal.transfer.toPath" :title="confirmModal.transfer.toPath"></span>
                </div>
            </div>
        </template>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
            <button @click="cancelConfirmModal()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                Cancel
            </button>
            <button @click="handleConfirmModal()" :class="confirmModal.confirmClass || 'bg-indigo-600 hover:bg-indigo-500'" class="px-4 py-1.5 rounded-lg text-xs font-bold text-white transition-all shadow-md">
                <span x-text="confirmModal.confirmText || 'Confirm'"></span>
            </button>
        </div>
    </div>
</div>
{{ end }}

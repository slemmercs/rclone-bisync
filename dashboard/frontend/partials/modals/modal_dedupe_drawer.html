{{define "modal_dedupe_drawer"}}
<!-- Staged Actions Review Slide-Up Drawer -->
<div x-show="getStagedDedupeCount() > 0 && dedupeBatch.drawerOpen"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-y-4"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 translate-y-4"
     class="border-t border-slate-800 bg-slate-900/95 backdrop-blur-md flex flex-col max-h-60 shrink-0 overflow-hidden shadow-2xl">

    <!-- Drawer Header -->
    <div class="px-4 py-2 border-b border-slate-800 flex items-center justify-between gap-3 bg-slate-950/70 shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-200 uppercase tracking-wider">Staged Review</span>
            <span class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-mono text-[11px]" x-text="getStagedDedupeCount() + ' total'"></span>
            <div class="flex items-center gap-1.5 ml-2 text-[11px] font-mono">
                <span x-show="getStagedCounts().delete > 0" class="px-1.5 py-0.5 rounded bg-rose-950/50 text-rose-300 border border-rose-800/40" x-text="getStagedCounts().delete + ' delete'"></span>
                <span x-show="getStagedCounts().rename > 0" class="px-1.5 py-0.5 rounded bg-amber-950/50 text-amber-300 border border-amber-800/40" x-text="getStagedCounts().rename + ' rename'"></span>
                <span x-show="getStagedCounts().keep > 0" class="px-1.5 py-0.5 rounded bg-emerald-950/50 text-emerald-300 border border-emerald-800/40" x-text="getStagedCounts().keep + ' keep'"></span>
            </div>
        </div>
        <button type="button" @click="toggleStagedDrawer()" class="text-slate-400 hover:text-white p-1 rounded-lg transition-colors cursor-pointer" title="Collapse Drawer">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
    </div>

    <!-- Batch Progress Indicator -->
    <template x-if="dedupeBatch.applying || (dedupeBatch.progress && dedupeBatch.progress.status !== 'idle')">
        <div class="px-4 py-2 bg-slate-950/90 border-b border-slate-800 space-y-1.5 shrink-0">
            <div class="flex items-center justify-between text-xs font-mono">
                <span class="text-slate-300 truncate" x-text="dedupeBatch.progress.currentAction || 'Applying staged batch...'"></span>
                <span class="text-amber-400 font-bold" x-text="(dedupeBatch.progress.percent || 0) + '%'"></span>
            </div>
            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-amber-500 transition-all duration-300 rounded-full" :style="'width: ' + (dedupeBatch.progress.percent || 0) + '%'" :class="{ 'bg-emerald-500': dedupeBatch.progress.status === 'complete', 'bg-rose-500': dedupeBatch.progress.status === 'error', 'animate-pulse': dedupeBatch.applying }"></div>
            </div>
        </div>
    </template>

    <!-- Staged Action Items List -->
    <div class="flex-1 overflow-y-auto p-2 space-y-1 divide-y divide-slate-800/50">
        <template x-for="item in getStagedEntries()" :key="item.key">
            <div class="pt-1 first:pt-0 flex items-center justify-between gap-3 text-xs px-2 py-1 rounded-lg hover:bg-slate-800/50 transition-colors">
                <div class="flex items-center gap-2.5 min-w-0">
                    <span class="px-2 py-0.5 rounded font-mono font-bold text-[10px] uppercase shrink-0"
                          :class="{
                              'bg-rose-500/20 text-rose-300 border border-rose-500/30': item.action === 'delete',
                              'bg-amber-500/20 text-amber-300 border border-amber-500/30': item.action === 'rename',
                              'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30': item.action === 'keep'
                          }"
                          x-text="item.action"></span>
                    <div class="min-w-0">
                        <div class="text-slate-200 font-mono truncate text-[11px]">
                            <span x-text="item.path"></span>
                            <span class="text-slate-500 ml-1" x-text="'(Copy #' + (item.candidate || 1) + ')'"></span>
                        </div>
                        <template x-if="item.action === 'rename' && item.new_name">
                            <div class="text-[10px] text-amber-300/90 font-mono truncate">
                                ➔ rename to: <span class="font-bold" x-text="item.new_name"></span>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <span class="text-[10px] font-mono text-slate-400" x-text="formatBytes(item.size || 0)"></span>
                    <button type="button" @click="unstageCandidateAction(item.key)" class="p-1 rounded text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition-colors cursor-pointer" title="Unstage candidate action">
                        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
            </div>
        </template>
    </div>
</div>
{{end}}

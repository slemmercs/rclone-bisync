{{ define "modal_delete" }}
        <!-- Delete Confirmation Modal (Configurable 1 or 2 Steps) -->
        <div x-show="deleteModal.show" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm" x-transition.opacity.duration.200ms>
            <div @click.away="cancelDelete()" class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl relative space-y-4">
                <!-- Header -->
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 shrink-0">
                            <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                        </div>
                        <div>
                            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Confirm Deletion</h3>
                            <div class="text-[11px] text-slate-400" x-text="deleteModal.step === 1 ? 'Step 1 of 2: Review Item' : 'Step 2 of 2: Final Confirmation'"></div>
                        </div>
                    </div>
                    <button @click="cancelDelete()" class="text-slate-500 hover:text-white p-1 rounded-lg transition-colors">
                        <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>

                <!-- Target Item Info Box -->
                <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-3 space-y-1.5 font-mono text-xs">
                    <div class="flex items-center justify-between text-slate-400">
                        <span class="text-slate-500">Storage Target:</span>
                        <span class="font-bold" :class="deleteModal.paneKey === 'left' ? 'text-indigo-400' : 'text-emerald-400'" x-text="deleteModal.paneKey ? explorer[deleteModal.paneKey].target.toUpperCase() : ''"></span>
                    </div>
                    <div class="flex items-center justify-between text-slate-400">
                        <span class="text-slate-500">Item Name:</span>
                        <span class="text-slate-200 font-semibold truncate max-w-[14rem]" x-text="deleteModal.item ? deleteModal.item.Name : ''"></span>
                    </div>
                    <div class="flex items-center justify-between text-slate-400">
                        <span class="text-slate-500">Type:</span>
                        <span x-text="deleteModal.item?.IsDir ? 'Directory (all contents)' : 'Single File'"></span>
                    </div>
                </div>

                <!-- Step 1 Notice -->
                <template x-if="deleteModal.step === 1">
                    <p class="text-xs text-slate-300 leading-relaxed">
                        Are you sure you want to delete <span class="font-bold text-rose-300 font-mono" x-text="deleteModal.item?.Name"></span>?
                        This action will permanently remove it from storage.
                    </p>
                </template>

                <!-- Step 2 Notice -->
                <template x-if="deleteModal.step === 2">
                    <div class="p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs text-rose-300 space-y-1">
                        <p class="font-semibold text-rose-200 flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-rose-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12.01" x2="12.01" y1="17" y2="17"/></svg>
                            <span>Permanent Deletion Warning</span>
                        </p>
                        <p class="text-[11px] text-rose-300/80">Please confirm once more. This cannot be undone.</p>
                    </div>
                </template>

                <!-- Actions -->
                <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                    <button @click="cancelDelete()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                        Cancel
                    </button>
                    <button @click="advanceDeleteStep()" :disabled="deleteModal.deleting" class="px-4 py-1.5 rounded-lg text-xs font-bold text-white transition-all shadow-md flex items-center gap-1.5" :class="deleteModal.step === 1 ? 'bg-amber-600 hover:bg-amber-500' : 'bg-rose-600 hover:bg-rose-500 shadow-rose-950/50'">
                        <svg x-show="deleteModal.deleting" class="w-3.5 h-3.5 animate-spin shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                        <span x-text="deleteModal.deleting ? 'Deleting...' : (deleteModal.step === 1 ? 'Next' : 'Confirm & Delete')"></span>
                        <svg x-show="!deleteModal.deleting && deleteModal.step === 1" class="w-3.5 h-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </div>
{{ end }}

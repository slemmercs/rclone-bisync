{{ define "modal_deletions" }}
    <!-- Review Pending Deletions Modal -->
    <div x-show="showDeletionsModal" x-transition.opacity.duration.200ms class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
            <!-- Modal Header -->
            <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950/50">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-rose-500/10 text-rose-400 rounded-xl border border-rose-500/20 shrink-0">
                        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Pending Deletions Review</h3>
                        <div class="text-xs text-slate-400 mt-0.5" x-text="`${deletionsData.total_count} files queued for deletion`"></div>
                    </div>
                </div>
                <button @click="showDeletionsModal = false" class="text-slate-400 hover:text-slate-200 transition-colors p-1.5 rounded-lg hover:bg-slate-800">
                    <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-5 overflow-y-auto space-y-4 flex-1">
                <!-- Context alert -->
                <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 text-xs space-y-2">
                    <div class="flex justify-between items-center text-slate-300">
                        <span class="text-slate-500 font-medium">Origin Source:</span>
                        <span class="font-semibold text-rose-400 font-mono" x-text="deletionsData.source || 'Google Drive (remote)'"></span>
                    </div>
                    <div class="flex justify-between items-center text-slate-300 border-t border-slate-900 pt-1.5">
                        <span class="text-slate-500 font-medium">Target Impact:</span>
                        <span class="font-semibold text-amber-400 font-mono" x-text="deletionsData.target_action || 'Will be deleted locally from ~/gdrive'"></span>
                    </div>
                </div>

                <!-- Search filter -->
                <div>
                    <input type="text" x-model="deletionsSearch" placeholder="Filter files (e.g. .pdf, invoice, photo)..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono transition-colors">
                </div>

                <!-- Files list container -->
                <div class="border border-slate-800 rounded-xl bg-slate-950/60 overflow-hidden">
                    <div class="bg-slate-950/90 px-3 py-2 border-b border-slate-800/80 flex justify-between items-center text-[11px] font-mono text-slate-500 uppercase">
                        <span>Queued File Path</span>
                        <span x-text="`${filteredDeletions.length} items`"></span>
                    </div>
                    <div class="max-h-60 overflow-y-auto p-2 space-y-1 font-mono text-xs">
                        <template x-for="file in filteredDeletions" :key="file">
                            <div class="px-2.5 py-1 rounded bg-slate-900/60 hover:bg-slate-900 border border-slate-800/40 text-slate-300 flex items-center justify-between gap-2 transition-colors truncate">
                                <span class="truncate text-rose-300 font-mono text-[11px]" x-text="'✕ ' + file" :title="file"></span>
                            </div>
                        </template>
                        <div x-show="filteredDeletions.length === 0" class="text-slate-500 text-center py-4 font-mono text-xs">No files match filter query.</div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex flex-col-reverse sm:flex-row justify-end gap-2.5">
                <button @click="showDeletionsModal = false" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs font-semibold hover:bg-slate-700 transition-colors">Cancel & Protect Files</button>
                <button @click="showDeletionsModal = false; triggerAction('force_sync')" class="px-4 py-2 bg-rose-600 text-white rounded-lg text-xs font-bold hover:bg-rose-500 transition-colors flex items-center justify-center gap-1.5 shadow-lg shadow-rose-950/40">
                    <span>Authorize & Delete with --force</span>
                </button>
            </div>
        </div>
    </div>
{{ end }}

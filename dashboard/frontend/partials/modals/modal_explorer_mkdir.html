{{ define "modal_explorer_mkdir" }}
<!-- Create Folder / Directory Modal -->
<div x-show="mkdirModal.show" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div @click.outside="cancelCreateFolder()" class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
                <h3 class="text-base font-bold text-white tracking-wide">Create New Folder</h3>
            </div>
            <button @click="cancelCreateFolder()" class="text-slate-400 hover:text-white transition-colors p-1 rounded-lg">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Target Storage Location</label>
                <div class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-300 flex items-center justify-between">
                    <span class="text-indigo-300 font-semibold uppercase" x-text="mkdirModal.paneKey ? getPaneTargetLabel(mkdirModal.paneKey) : ''"></span>
                    <span class="text-slate-400 truncate max-w-[14rem]" x-text="mkdirModal.paneKey ? (explorer[mkdirModal.paneKey].path || '/') : ''"></span>
                </div>
            </div>

            <div>
                <label for="mkdir-input" class="block text-xs font-semibold text-slate-300 mb-1">Folder Name</label>
                <input id="mkdir-input" type="text" x-model="mkdirModal.dirName" @keydown.enter.prevent="executeCreateFolder()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 font-mono" placeholder="e.g. documents, archive, projects" autofocus>
            </div>

            <div class="p-2.5 rounded-lg bg-indigo-950/30 border border-indigo-500/20 text-[11px] text-indigo-300 space-y-1">
                <div class="font-medium text-slate-200">Safe Directory Provisioning</div>
                <div class="text-slate-400">Created immediately on the active storage provider. The canary identifier (<span class="font-mono text-amber-300">RCLONE_TEST</span>) and path traversal are strictly prevented.</div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-2.5 pt-2 border-t border-slate-800/80">
            <button type="button" @click="cancelCreateFolder()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-colors">Cancel</button>
            <button id="mkdir-confirm-btn" type="button" @click="executeCreateFolder()" :disabled="isMkdirDisabled()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-xl text-xs font-medium transition-colors flex items-center gap-1.5 shadow-lg shadow-indigo-950/40">
                <svg x-show="mkdirModal.creating" class="w-3.5 h-3.5 animate-spin shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                <span x-text="mkdirModal.creating ? 'Creating...' : 'Create Folder'"></span>
            </button>
        </div>
    </div>
</div>
{{ end }}

{{ define "modal_explorer_move" }}
<!-- Move & Rename File / Directory Modal -->
<div x-show="moveModal.show" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div @click.outside="cancelMove()" class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 5-3-3H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2"/><path d="M8 18h1"/><path d="M18.4 9.6a2 2 0 1 1 3 3L14 20l-4 1 1-4Z"/></svg>
                <h3 class="text-base font-bold text-white tracking-wide" x-text="moveModal.item && moveModal.item.IsDir ? 'Move / Rename Directory' : 'Move / Rename File'"></h3>
            </div>
            <button @click="cancelMove()" class="text-slate-400 hover:text-white transition-colors p-1 rounded-lg">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Source Item</label>
                <div class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-300 truncate" x-text="moveModal.item ? moveModal.item.Name : ''"></div>
            </div>

            <div>
                <label for="move-new-name-input" class="block text-xs font-semibold text-slate-300 mb-1">New Name or Subpath</label>
                <input id="move-new-name-input" type="text" x-model="moveModal.newName" @keydown.enter.prevent="executeMoveItem()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 font-mono" placeholder="Enter new filename...">
            </div>

            <div class="p-2.5 rounded-lg bg-indigo-950/30 border border-indigo-500/20 text-[11px] text-indigo-300 space-y-1">
                <div class="font-medium text-slate-200">Atomic Safe Move</div>
                <div class="text-slate-400">Local moves execute via filesystem rename; cloud moves execute via Rclone RC operations. Canary file (<span class="font-mono text-amber-300">RCLONE_TEST</span>) cannot be renamed.</div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-2.5 pt-2 border-t border-slate-800/80">
            <button type="button" @click="cancelMove()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-colors">Cancel</button>
            <button id="move-confirm-btn" type="button" @click="executeMoveItem()" :disabled="isMoveDisabled()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-xl text-xs font-medium transition-colors flex items-center gap-1.5 shadow-lg shadow-indigo-950/40">
                <svg x-show="moveModal.moving" class="w-3.5 h-3.5 animate-spin shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                <span x-text="moveModal.moving ? 'Moving...' : 'Confirm Move'"></span>
            </button>
        </div>
    </div>
</div>
{{ end }}

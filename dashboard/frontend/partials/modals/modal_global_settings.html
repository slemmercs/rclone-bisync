{{ define "modal_global_settings" }}
<!-- Modal Backdrop: Global Fleet Settings -->
<div id="modal-global-settings" x-show="globalSettingsModal && globalSettingsModal.show" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm" @click.self="closeGlobalSettingsModal()" @keydown.escape.window="closeGlobalSettingsModal()">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4 font-sans text-left" @click.stop>
        <!-- Modal Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 shrink-0">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-white uppercase tracking-wider">Global Fleet Settings</h3>
                    <div class="text-[11px] text-slate-400">Daemon engine tuning, fallback flags, and alert integrations</div>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button type="button" @click="openHelpDrawer('modal_global_settings')" class="text-slate-500 hover:text-indigo-400 p-1.5 rounded-lg transition-colors cursor-pointer" title="Open Settings Guidance (F1)">
                    <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </button>
                <button @click="closeGlobalSettingsModal()" class="text-slate-500 hover:text-white p-1 rounded-lg transition-colors" title="Close modal (Esc)">
                    <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex flex-wrap items-center gap-1.5 border-b border-slate-800 pb-2.5 text-xs font-semibold">
            <button @click="globalSettingsModal.tab = 'defaults'" :class="globalSettingsModal.tab === 'defaults' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg transition-colors cursor-pointer">Operational Defaults</button>
            <button @click="globalSettingsModal.tab = 'engine'" :class="globalSettingsModal.tab === 'engine' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg transition-colors cursor-pointer">Engine &amp; Polling</button>
            <button @click="globalSettingsModal.tab = 'bandwidth'; fetchBandwidthLimit(); fetchCoreStats()" :class="globalSettingsModal.tab === 'bandwidth' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg transition-colors cursor-pointer">Bandwidth Throttling</button>
            <button @click="globalSettingsModal.tab = 'notifications'" :class="globalSettingsModal.tab === 'notifications' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg transition-colors cursor-pointer">Alerts &amp; Webhooks</button>
            <button @click="globalSettingsModal.tab = 'security'" :class="globalSettingsModal.tab === 'security' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg transition-colors cursor-pointer">Config Security</button>
        </div>
        <!-- Tab 1: Operational Defaults -->
        <template x-if="globalSettingsModal.tab === 'defaults'">
            <div class="space-y-4">
                <div class="text-[11px] text-slate-400">Baseline operational parameters inherited by profiles unless overridden.</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="flex items-center gap-1.5 text-xs font-semibold text-slate-300 mb-1">
                            <span>Max Delete Threshold (%)</span>
                            <span class="group relative inline-flex items-center text-slate-500 hover:text-indigo-400 cursor-help" tabindex="0">
                                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                <div class="absolute bottom-full left-0 mb-2 hidden group-hover:flex group-focus:flex flex-col w-64 p-2.5 rounded-xl bg-slate-950 border border-slate-700/80 shadow-2xl z-50 pointer-events-none text-left">
                                    <span class="text-xs font-bold text-white mb-0.5">Global TOO_MANY_DELETES</span>
                                    <span class="text-[11px] font-normal leading-relaxed text-slate-300">Default deletion ceiling percentage applied across all workloads without custom overrides.</span>
                                    <div class="absolute left-3 top-full -mt-px w-2 h-2 bg-slate-950 border-b border-r border-slate-700/80 rotate-45"></div>
                                </div>
                            </span>
                        </label>
                        <input type="number" x-model.number="globalSettingsModal.config.global_defaults.max_delete" min="1" max="100" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Conflict Resolution Strategy</label>
                        <select x-model="globalSettingsModal.config.global_defaults.conflict_resolve" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                            <option value="newer">newer (Keep newest file)</option>
                            <option value="older">older (Keep oldest file)</option>
                            <option value="larger">larger (Keep largest file)</option>
                            <option value="smaller">smaller (Keep smallest file)</option>
                            <option value="path1">path1 (Prefer Remote)</option>
                            <option value="path2">path2 (Prefer Local)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Comparison Mode</label>
                        <select x-model="globalSettingsModal.config.global_defaults.compare_mode" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                            <option value="size,modtime">size,modtime (Default: Standard / Everyday Sync)</option>
                            <option value="size,modtime,checksum">size,modtime,checksum (Most Thorough & Reliable / Hash Integrity)</option>
                            <option value="checksum">checksum (Thorough Hash Only)</option>
                            <option value="modtime">modtime (Timestamp Only)</option>
                        </select>
                        <p class="text-[10px] text-amber-400/90 mt-1 flex items-center gap-1">
                            <svg class="w-3 h-3 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                            <span>Changing default compare mode requires a one-time <strong>Resync</strong> on affected profiles.</span>
                        </p>
                    </div>
                    <div>
                        <label class="flex items-center gap-1.5 text-xs font-semibold text-slate-300 mb-1">
                            <span>Canary Guard Probing</span>
                            <span class="group relative inline-flex items-center text-slate-500 hover:text-indigo-400 cursor-help" tabindex="0">
                                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                <div class="absolute bottom-full left-0 mb-2 hidden group-hover:flex group-focus:flex flex-col w-64 p-2.5 rounded-xl bg-slate-950 border border-slate-700/80 shadow-2xl z-50 pointer-events-none text-left">
                                    <span class="text-xs font-bold text-white mb-0.5">Canary Token Verification</span>
                                    <span class="text-[11px] font-normal leading-relaxed text-slate-300">Requires RCLONE_TEST canary presence on both storage endpoints before synchronization commences.</span>
                                    <div class="absolute left-3 top-full -mt-px w-2 h-2 bg-slate-950 border-b border-r border-slate-700/80 rotate-45"></div>
                                </div>
                            </span>
                        </label>
                        <select :value="globalSettingsModal.config.global_defaults.canary_validation ? 'true' : 'false'" @change="globalSettingsModal.config.global_defaults.canary_validation = ($event.target.value === 'true')" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                            <option value="true">Enabled (Strict RCLONE_TEST Guard)</option>
                            <option value="false">Disabled (Bypass Probing)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">File Explorer Remote Scoping</label>
                        <select :value="globalSettingsModal.config.global_defaults.lock_explorer_remote ? 'true' : 'false'" @change="globalSettingsModal.config.global_defaults.lock_explorer_remote = ($event.target.value === 'true')" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                            <option value="false">Unlocked (Freely select any remote)</option>
                            <option value="true">Locked to Active Profile Remote</option>
                        </select>
                    </div>
                </div>
            </div>
        </template>

        <!-- Tab 2: Engine & Polling Tuning -->
        <template x-if="globalSettingsModal.tab === 'engine'">
            <div class="space-y-4">
                <div class="text-[11px] text-slate-400">Core daemon timeout and execution scheduler parameters.</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Job Execution Timeout (seconds)</label>
                        <input type="number" x-model.number="globalSettingsModal.config.daemon.job_timeout_seconds" min="60" max="86400" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                    </div>
                    <div>
                        <label class="flex items-center gap-1.5 text-xs font-semibold text-slate-300 mb-1">
                            <span>Stale Lock Timeout (seconds)</span>
                            <span class="group relative inline-flex items-center text-slate-500 hover:text-indigo-400 cursor-help" tabindex="0">
                                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                <div class="absolute bottom-full left-0 mb-2 hidden group-hover:flex group-focus:flex flex-col w-64 p-2.5 rounded-xl bg-slate-950 border border-slate-700/80 shadow-2xl z-50 pointer-events-none text-left">
                                    <span class="text-xs font-bold text-white mb-0.5">POSIX flock Isolation</span>
                                    <span class="text-[11px] font-normal leading-relaxed text-slate-300">Prevents multiple runner processes from writing to the same profile simultaneously. Stale locks from crashed processes are reclaimed after this duration.</span>
                                    <div class="absolute left-3 top-full -mt-px w-2 h-2 bg-slate-950 border-b border-r border-slate-700/80 rotate-45"></div>
                                </div>
                            </span>
                        </label>
                        <input type="number" x-model.number="globalSettingsModal.config.daemon.lock_stale_timeout_seconds" min="300" max="86400" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Polling Initial Sleep (seconds)</label>
                        <input type="number" x-model.number="globalSettingsModal.config.daemon.job_poll_initial_sleep_sec" min="1" max="60" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Rate Limit Backoff (hours)</label>
                        <input type="number" x-model.number="globalSettingsModal.config.daemon.rate_limit_backoff_hours" min="0.5" max="24" step="0.5" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                    </div>
                </div>
            </div>
        </template>
        <!-- Tab: Bandwidth Throttling -->
        <template x-if="globalSettingsModal.tab === 'bandwidth'">
            <div class="space-y-4">
                <div class="text-[11px] text-slate-400">Dynamic engine bandwidth throttling and active transfer rate limits backed by Rclone RC core/bwlimit.</div>

                <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800/80 space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-slate-300">Current Throttling Ceiling</span>
                        <span class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold uppercase tracking-wider" :class="bandwidth.currentLimit !== 'off' && bandwidth.currentLimit !== '' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-slate-800 text-slate-300 border border-slate-700'" x-text="bandwidth.currentLimit !== 'off' && bandwidth.currentLimit !== '' ? ('Limit: ' + bandwidth.rateFormatted) : 'Unlimited (off)'"></span>
                    </div>

                    <div class="pt-2 border-t border-slate-800/60">
                        <label class="block text-xs font-semibold text-slate-300 mb-2">Throttling Presets</label>
                        <div class="grid grid-cols-5 gap-2">
                            <template x-for="p in bandwidth.presets" :key="p">
                                <button type="button" @click="setBandwidthLimit(p)" :disabled="isBandwidthUpdating()" class="py-1.5 px-2 rounded-lg text-xs font-mono font-semibold transition-all border text-center cursor-pointer" :class="(bandwidth.currentLimit === p || (p === 'off' && bandwidth.currentLimit === '')) ? 'bg-indigo-600 text-white border-indigo-500 shadow-sm' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-700 hover:border-slate-600'" x-text="p === 'off' ? 'Max (off)' : p"></button>
                            </template>
                        </div>
                    </div>

                    <div class="pt-2 border-t border-slate-800/60">
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Custom Rate Limit</label>
                        <form @submit.prevent="applyCustomBandwidthLimit()" class="flex items-center gap-2">
                            <input type="text" x-model="bandwidth.customInput" placeholder="e.g. 15M, 500k, 1.5G, off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono placeholder:text-slate-600">
                            <button type="submit" :disabled="isBandwidthUpdating()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shrink-0 transition-colors cursor-pointer shadow-sm">
                                <span x-text="isBandwidthUpdating() ? 'Applying...' : 'Apply Limit'"></span>
                            </button>
                        </form>
                        <div class="text-[10px] text-slate-500 mt-1">Specify rate with unit suffix (e.g. 500k, 10M, 1G) or 'off' to disable throttling. Applied immediately to running engine.</div>
                    </div>
                </div>

                <!-- Live Engine Speed & Transfers Overview -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs font-mono">
                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
                        <div class="text-[9px] uppercase font-bold text-slate-500">Live Speed</div>
                        <div class="text-sm font-bold text-white mt-0.5" x-text="formatSpeed(bandwidth.speed)"></div>
                    </div>
                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
                        <div class="text-[9px] uppercase font-bold text-slate-500">Transferred</div>
                        <div class="text-sm font-bold text-indigo-300 mt-0.5" x-text="formatBytes(bandwidth.bytes)"></div>
                    </div>
                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
                        <div class="text-[9px] uppercase font-bold text-slate-500">Transfers</div>
                        <div class="text-sm font-bold text-emerald-400 mt-0.5" x-text="bandwidth.transfers"></div>
                    </div>
                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
                        <div class="text-[9px] uppercase font-bold text-slate-500">Errors</div>
                        <div class="text-sm font-bold mt-0.5" :class="bandwidth.errors > 0 ? 'text-rose-400' : 'text-slate-300'" x-text="bandwidth.errors"></div>
                    </div>
                </div>
            </div>
        </template>


        <!-- Tab 3: Alerts & Webhooks -->
        <template x-if="globalSettingsModal.tab === 'notifications'">
            <div class="space-y-4">
                <div class="text-[11px] text-slate-400">External monitoring and incident notification endpoints.</div>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Webhook Notification URL</label>
                        <input type="url" x-model="globalSettingsModal.config.notifications.webhook_url" placeholder="https://discord.com/api/webhooks/..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Heartbeat / Watchdog Ping URL</label>
                        <input type="url" x-model="globalSettingsModal.config.notifications.watchdog_ping_url" placeholder="https://hc-ping.com/..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                    </div>
                </div>
            </div>
        </template>

        <!-- Tab 4: Config Security & Encryption -->
        <template x-if="globalSettingsModal.tab === 'security'">
            <div class="space-y-4">
                <div class="text-[11px] text-slate-400">Manage encryption password protection for rclone.conf.</div>
                
                <!-- Status Badge Banner -->
                <div class="p-3 bg-slate-950/60 border border-slate-800 rounded-xl flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" :class="globalSettingsModal.encryption.is_encrypted ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-slate-400 border border-slate-700'">
                            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <div>
                            <div class="text-xs font-semibold text-white flex items-center gap-1.5">
                                <span>Rclone Configuration:</span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase tracking-wider" :class="globalSettingsModal.encryption.is_encrypted ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800 text-slate-400 border border-slate-700'" x-text="globalSettingsModal.encryption.is_encrypted ? 'Encrypted' : 'Unencrypted'"></span>
                            </div>
                            <div class="text-[10px] text-slate-500 font-mono truncate mt-0.5" x-text="globalSettingsModal.encryption.config_file || '~/.config/rclone/rclone.conf'"></div>
                        </div>
                    </div>
                    <button type="button" @click="fetchConfigEncryptionStatus()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[10px] font-medium transition-colors cursor-pointer">
                        Refresh
                    </button>
                </div>

                <!-- Set or Change Password Form -->
                <div class="p-3.5 bg-slate-950/40 border border-slate-800/80 rounded-xl space-y-3">
                    <h4 class="text-xs font-bold text-slate-200" x-text="globalSettingsModal.encryption.is_encrypted ? 'Change Configuration Passphrase' : 'Set Configuration Encryption Passphrase'"></h4>
                    
                    <div x-show="globalSettingsModal.encryption.is_encrypted">
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Current Passphrase</label>
                        <input type="password" x-model="globalSettingsModal.encryption.old_password" placeholder="Current passphrase" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">New Passphrase</label>
                            <input type="password" x-model="globalSettingsModal.encryption.new_password" placeholder="New passphrase" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Confirm New Passphrase</label>
                            <input type="password" x-model="globalSettingsModal.encryption.confirm_password" placeholder="Confirm passphrase" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <button type="button" x-show="globalSettingsModal.encryption.is_encrypted" @click="removeConfigPassword()" :disabled="isEncryptionLoading()" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-semibold transition-colors cursor-pointer">
                            Remove Encryption
                        </button>
                        <span x-show="!globalSettingsModal.encryption.is_encrypted"></span>
                        <button type="button" @click="setConfigPassword()" :disabled="isEncryptionLoading()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors cursor-pointer shadow-sm">
                            <span x-text="globalSettingsModal.encryption.loading ? 'Updating...' : (globalSettingsModal.encryption.is_encrypted ? 'Update Key' : 'Encrypt Config')"></span>
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Error Feedback -->
        <template x-if="globalSettingsModal.error">
            <div class="p-2.5 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs text-rose-300" x-text="globalSettingsModal.error"></div>
        </template>

        <!-- Action Footer -->
        <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
            <button @click="closeGlobalSettingsModal()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-medium transition-colors">Cancel</button>
            <button @click="saveGlobalSettings()" :disabled="isGlobalSettingsSaving()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-lg shadow-indigo-950/40 transition-colors">
                <span x-text="globalSettingsModal.saving ? 'Saving...' : 'Apply Fleet Settings'"></span>
            </button>
        </div>
    </div>
</div>
{{ end }}

{{ define "modal_provider_options" }}
<!-- Target Provider Configuration (Tier 1 Curated UI & Tier 2 Guided Flag Builder) -->
<div class="bg-slate-950/60 border border-slate-800/70 rounded-xl p-3 space-y-3">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
            <label class="text-xs font-semibold text-slate-300">Target Provider Options</label>
            <span class="text-[9px] px-2 py-0.5 rounded font-mono font-bold uppercase"
                  :class="isTier1Provider() ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-slate-800 text-slate-400 border border-slate-700/60'"
                  x-text="isTier1Provider() ? getEditingRemoteType().toUpperCase() : 'GENERIC REMOTE'"></span>
        </div>
        <span class="text-[10px] text-slate-500 font-mono" x-text="profileModal.editing?.remote ? profileModal.editing.remote : 'No Remote Selected'"></span>
    </div>

    <!-- Tier 1: Google Drive Controls -->
    <template x-if="getEditingRemoteType() === 'drive'">
        <div class="space-y-2.5 pt-1 border-t border-slate-900">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2">
                <label class="flex items-center gap-2 p-2 bg-slate-900/80 rounded-lg border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                    <input type="checkbox" :checked="getProviderBoolOption('drive_skip_shortcuts', true)" @change="setProviderBoolOption('drive_skip_shortcuts', $event.target.checked)" class="rounded bg-slate-950 border-slate-700 text-indigo-500">
                    <span class="text-[11px] text-slate-300 font-medium">Skip Shortcuts</span>
                </label>
                <label class="flex items-center gap-2 p-2 bg-slate-900/80 rounded-lg border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                    <input type="checkbox" :checked="getProviderBoolOption('drive_use_trash', true)" @change="setProviderBoolOption('drive_use_trash', $event.target.checked)" class="rounded bg-slate-950 border-slate-700 text-indigo-500">
                    <span class="text-[11px] text-slate-300 font-medium">Use Trash</span>
                </label>
                <label class="flex items-center gap-2 p-2 bg-slate-900/80 rounded-lg border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                    <input type="checkbox" :checked="getProviderBoolOption('drive_shared_with_me', false)" @change="setProviderBoolOption('drive_shared_with_me', $event.target.checked)" class="rounded bg-slate-950 border-slate-700 text-indigo-500">
                    <span class="text-[11px] text-slate-300 font-medium">Shared With Me</span>
                </label>
                <label class="flex items-center gap-2 p-2 bg-slate-900/80 rounded-lg border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                    <input type="checkbox" :checked="getProviderBoolOption('drive_skip_gdocs', false)" @change="setProviderBoolOption('drive_skip_gdocs', $event.target.checked)" class="rounded bg-slate-950 border-slate-700 text-indigo-500">
                    <span class="text-[11px] text-slate-300 font-medium">Skip GDocs</span>
                </label>
                <label class="flex items-center gap-2 p-2 bg-slate-900/80 rounded-lg border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                    <input type="checkbox" :checked="getProviderBoolOption('drive_acknowledge_abuse', false)" @change="setProviderBoolOption('drive_acknowledge_abuse', $event.target.checked)" class="rounded bg-slate-950 border-slate-700 text-indigo-500">
                    <span class="text-[11px] text-slate-300 font-medium">Ack Abuse</span>
                </label>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-1">Export Formats</label>
                    <input type="text" :value="getProviderOption('drive_export_formats', 'docx,xlsx,pptx')" @input="setProviderOption('drive_export_formats', $event.target.value)" placeholder="docx,xlsx,pptx" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-1">Import Formats (Optional)</label>
                    <input type="text" :value="getProviderOption('drive_import_formats', '')" @input="setProviderOption('drive_import_formats', $event.target.value)" placeholder="docx,xlsx,pptx" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
            </div>
        </div>
    </template>

    <!-- Tier 1: OneDrive Controls -->
    <template x-if="getEditingRemoteType() === 'onedrive'">
        <div class="space-y-2.5 pt-1 border-t border-slate-900">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <label class="flex items-center gap-2 p-2 bg-slate-900/80 rounded-lg border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                    <input type="checkbox" :checked="getProviderBoolOption('onedrive_no_versions', true)" @change="setProviderBoolOption('onedrive_no_versions', $event.target.checked)" class="rounded bg-slate-950 border-slate-700 text-indigo-500">
                    <span class="text-[11px] text-slate-300 font-medium">No Versions (Prevent duplicates)</span>
                </label>
                <label class="flex items-center gap-2 p-2 bg-slate-900/80 rounded-lg border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                    <input type="checkbox" :checked="getProviderBoolOption('onedrive_delta', false)" @change="setProviderBoolOption('onedrive_delta', $event.target.checked)" class="rounded bg-slate-950 border-slate-700 text-indigo-500">
                    <span class="text-[11px] text-slate-300 font-medium">Delta Enumeration (--onedrive-delta)</span>
                </label>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-1">Upload Chunk Size (Optional)</label>
                    <input type="text" :value="getProviderOption('onedrive_chunk_size', '')" @input="setProviderOption('onedrive_chunk_size', $event.target.value)" placeholder="e.g. 10M, 50M (multiple of 320k)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
            </div>
        </div>
    </template>

    <!-- Tier 1: S3 Controls -->
    <template x-if="getEditingRemoteType() === 's3'">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1 border-t border-slate-900">
            <div>
                <label class="block text-[10px] font-semibold text-slate-400 mb-1">Storage Class</label>
                <select :value="getProviderOption('s3_storage_class', 'STANDARD')" @change="setProviderOption('s3_storage_class', $event.target.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                    <option value="STANDARD">STANDARD</option>
                    <option value="STANDARD_IA">STANDARD_IA</option>
                    <option value="ONEZONE_IA">ONEZONE_IA</option>
                    <option value="INTELLIGENT_TIERING">INTELLIGENT_TIERING</option>
                    <option value="GLACIER">GLACIER</option>
                    <option value="DEEP_ARCHIVE">DEEP_ARCHIVE</option>
                    <option value="GLACIER_IR">GLACIER_IR</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-semibold text-slate-400 mb-1">Part / Chunk Size</label>
                <input type="text" :value="getProviderOption('s3_chunk_size', '16M')" @input="setProviderOption('s3_chunk_size', $event.target.value)" placeholder="16M" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
            </div>
        </div>
    </template>

    <!-- Tier 1: Dropbox Controls -->
    <template x-if="getEditingRemoteType() === 'dropbox'">
        <div class="pt-1 border-t border-slate-900">
            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Upload Chunk Size</label>
            <input type="text" :value="getProviderOption('dropbox_chunk_size', '48M')" @input="setProviderOption('dropbox_chunk_size', $event.target.value)" placeholder="48M" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
        </div>
    </template>

    <!-- Tier 2: Generic Context Notice -->
    <template x-if="!isTier1Provider()">
        <div class="p-2.5 bg-slate-900/80 rounded-lg border border-slate-800 text-[11px] text-slate-400 space-y-1">
            <div class="font-medium text-slate-300">Generic Storage Backend</div>
            <div>All backend-specific tuning (e.g. Nextcloud, SFTP, WebDAV) is managed via the Guided CLI Flags builder below.</div>
        </div>
    </template>
</div>

<!-- Interactive Guided CLI Flags Builder & Synthesized Command Preview -->
<div class="bg-slate-950/60 border border-slate-800/70 rounded-xl p-3 space-y-3">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
            <label class="text-xs font-semibold text-slate-300">Operational &amp; Custom CLI Flags</label>
            <span class="text-[9px] px-2 py-0.5 rounded font-mono font-bold uppercase"
                  :class="customFlagRows.length > 0 ? 'bg-indigo-500/10 text-indigo-300 border border-indigo-500/20' : 'bg-slate-800 text-slate-400 border border-slate-700/60'"
                  x-text="customFlagRows.length + ' Active'"></span>
        </div>
        <button type="button" @click="addFlagRow()" class="inline-flex items-center gap-1 px-2.5 py-1 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 rounded-lg text-xs font-medium transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span>Add Flag</span>
        </button>
    </div>

    <!-- Quick Add Pills -->
    <div class="flex flex-wrap items-center gap-1.5 pt-0.5">
        <span class="text-[10px] text-slate-400 font-medium">Quick add:</span>
        <button type="button" @click="addFlagRow('--track-renames')" class="px-2 py-0.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded text-[10px] font-mono text-slate-300 transition">+ --track-renames</button>
        <button type="button" @click="addFlagRow('--fast-list')" class="px-2 py-0.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded text-[10px] font-mono text-slate-300 transition">+ --fast-list</button>
        <button type="button" @click="addFlagRow('--checkers')" class="px-2 py-0.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded text-[10px] font-mono text-slate-300 transition">+ --checkers</button>
        <button type="button" @click="addFlagRow('--transfers')" class="px-2 py-0.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded text-[10px] font-mono text-slate-300 transition">+ --transfers</button>
        <button type="button" @click="addFlagRow('--bwlimit')" class="px-2 py-0.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded text-[10px] font-mono text-slate-300 transition">+ --bwlimit</button>
        <button type="button" @click="addFlagRow('--resilient')" class="px-2 py-0.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded text-[10px] font-mono text-slate-300 transition">+ --resilient</button>
    </div>

    <!-- Flag Rows List -->
    <div class="space-y-2 pt-1">
        <template x-if="customFlagRows.length === 0">
            <div class="p-3 rounded-lg border border-dashed border-slate-800 text-center text-xs text-slate-500">
                No custom flags configured. Use <span class="text-indigo-400 font-medium">+ Add Flag</span> or click a quick flag above.
            </div>
        </template>

        <template x-for="(row, idx) in customFlagRows" :key="row.id">
            <div class="p-2 bg-slate-900/70 border border-slate-800 rounded-lg flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                <div class="sm:w-1/3">
                    <select :value="row.isCustom ? 'custom' : row.flag" @change="onFlagSelectChange(idx, $event.target.value)" class="w-full bg-slate-950 border border-slate-700 rounded-md px-2 py-1 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                        <option value="--track-renames" :hidden="!isFlagApplicableForEditingRemote('--track-renames')">--track-renames</option>
                        <option value="--track-renames-strategy" :hidden="!isFlagApplicableForEditingRemote('--track-renames-strategy')">--track-renames-strategy</option>
                        <option value="--fast-list" :hidden="!isFlagApplicableForEditingRemote('--fast-list')">--fast-list</option>
                        <option value="--checksum" :hidden="!isFlagApplicableForEditingRemote('--checksum')">--checksum</option>
                        <option value="--ignore-checksum" :hidden="!isFlagApplicableForEditingRemote('--ignore-checksum')">--ignore-checksum</option>
                        <option value="--size-only" :hidden="!isFlagApplicableForEditingRemote('--size-only')">--size-only</option>
                        <option value="--resilient" :hidden="!isFlagApplicableForEditingRemote('--resilient')">--resilient</option>
                        <option value="--recover" :hidden="!isFlagApplicableForEditingRemote('--recover')">--recover</option>
                        <option value="--checkers" :hidden="!isFlagApplicableForEditingRemote('--checkers')">--checkers</option>
                        <option value="--transfers" :hidden="!isFlagApplicableForEditingRemote('--transfers')">--transfers</option>
                        <option value="--bwlimit" :hidden="!isFlagApplicableForEditingRemote('--bwlimit')">--bwlimit</option>
                        <option value="--tpslimit" :hidden="!isFlagApplicableForEditingRemote('--tpslimit')">--tpslimit</option>
                        <option value="--tpslimit-burst" :hidden="!isFlagApplicableForEditingRemote('--tpslimit-burst')">--tpslimit-burst</option>
                        <option value="--buffer-size" :hidden="!isFlagApplicableForEditingRemote('--buffer-size')">--buffer-size</option>
                        <option value="--retries" :hidden="!isFlagApplicableForEditingRemote('--retries')">--retries</option>
                        <option value="--retries-sleep" :hidden="!isFlagApplicableForEditingRemote('--retries-sleep')">--retries-sleep</option>
                        <option value="--low-level-retries" :hidden="!isFlagApplicableForEditingRemote('--low-level-retries')">--low-level-retries</option>
                        <option value="custom">Custom flag (--...)</option>
                    </select>
                </div>

                <template x-if="row.isCustom">
                    <div class="sm:w-1/4">
                        <input type="text" :value="row.flag" @input="onFlagCustomNameInput(idx, $event.target.value)" placeholder="--custom-flag" class="w-full bg-slate-950 border border-slate-700 rounded-md px-2 py-1 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                    </div>
                </template>

                <div class="flex-1">
                    <template x-if="row.isBool">
                        <div class="flex items-center gap-1.5 px-2.5 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-md text-[11px] text-emerald-300 font-mono">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                            <span>Enabled (Boolean Switch)</span>
                        </div>
                    </template>
                    <template x-if="!row.isBool">
                        <input type="text" :value="row.value" @input="onFlagValueInput(idx, $event.target.value)" :placeholder="row.placeholder || 'Value...'" class="w-full bg-slate-950 border border-slate-700 rounded-md px-2.5 py-1 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                    </template>
                </div>

                <button type="button" @click="removeFlagRow(idx)" class="p-1 self-end sm:self-center text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded transition" title="Remove flag">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
        </template>
    </div>
    <!-- Prohibited Flags Error Warning -->
    <template x-if="getCustomFlagsValidationError(profileModal.editing?.flags?.custom_flags)">
        <div class="text-[11px] font-mono text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-lg p-2.5 flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0 text-rose-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12.01" y1="16" x2="12.01" y2="16"/></svg>
            <span x-text="getCustomFlagsValidationError(profileModal.editing?.flags?.custom_flags)"></span>
        </div>
    </template>

    <!-- Synthesized Real-time CLI Preview -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-3 space-y-2">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-semibold text-slate-300">Synthesized Bisync CLI Invocation</span>
                <span class="text-[9px] px-1.5 py-0.2 rounded font-mono bg-indigo-500/20 text-indigo-300">Live Preview</span>
            </div>
            <button type="button" @click="copyCLIPreview()" class="text-[10px] text-indigo-400 hover:text-indigo-300 font-mono transition flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <span x-text="cliCopied ? 'Copied!' : 'Copy Command'"></span>
            </button>
        </div>
        <pre class="text-[11px] font-mono text-indigo-200/90 bg-slate-950 p-2.5 rounded-md border border-slate-800/80 overflow-x-auto whitespace-pre-wrap break-all select-all leading-relaxed" x-text="generateCLIPreview()"></pre>
        <div class="text-[9px] text-slate-500">Auto-synthesized in real time from target endpoints, core flags, provider options, and guided CLI arguments.</div>
    </div>
</div>
{{ end }}

{{ define "modal_upload_dock" }}
<!-- Upload Dock & Transfer Telemetry Modal -->
<div x-show="uploadDockModal.show" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div @click.outside="closeUploadDockModal()" class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                <h3 class="text-base font-bold text-white tracking-wide">Upload Dock & Transfer Queue</h3>
                <span x-show="uploadDock.is_sync_active" class="px-2 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 uppercase tracking-wider font-bold">Sync In Progress (Deferred)</span>
            </div>
            <button @click="closeUploadDockModal()" class="text-slate-400 hover:text-white transition-colors p-1 rounded-lg">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <div class="space-y-3">
            <div class="flex items-center justify-between text-xs text-slate-400">
                <span x-text="`Pending Items: ${uploadDock.pending_count || 0}`"></span>
                <div class="flex items-center gap-2">
                    <button @click="fetchUploadDockStatus()" class="hover:text-indigo-300 transition-colors flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                        <span>Refresh</span>
                    </button>
                    <button @click="clearCompletedUploads()" class="text-rose-400 hover:text-rose-300 transition-colors">Clear Completed</button>
                </div>
            </div>

            <!-- Items Table -->
            <div class="max-h-72 overflow-y-auto border border-slate-800 rounded-xl bg-slate-950/60 divide-y divide-slate-800/60">
                <template x-if="!uploadDock.items || uploadDock.items.length === 0">
                    <div class="p-8 text-center text-slate-500 text-xs">No uploads in dock queue.</div>
                </template>
                <template x-for="(item, idx) in (uploadDock.items || [])" :key="item.id || idx">
                    <div class="p-3 flex items-center justify-between gap-3 text-xs">
                        <div class="min-w-0 flex-1">
                            <div class="font-medium text-slate-200 truncate font-mono" x-text="item.file_name"></div>
                            <div class="text-[10px] text-slate-400 truncate" x-text="`${item.remote}:${item.path || '/'} • ${formatBytes(item.size)}`"></div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase tracking-wider" :class="{
                                'bg-slate-800 text-slate-400 border border-slate-700': item.status === 'queued',
                                'bg-amber-500/20 text-amber-300 border border-amber-500/30': item.status === 'waiting_for_sync',
                                'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 animate-pulse': item.status === 'uploading',
                                'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30': item.status === 'completed',
                                'bg-rose-500/20 text-rose-300 border border-rose-500/30': item.status === 'failed'
                            }" x-text="item.status"></span>
                        </div>
                    </div>
                </template>
            </div>

            <div class="p-2.5 rounded-lg bg-slate-950 border border-slate-800 text-[11px] text-slate-400">
                <span class="text-indigo-300 font-semibold">Non-Blocking Coordination:</span> When profile synchronization is active, uploads are held safely in a waiting state to prevent corruption, and resumed automatically once locks release.
            </div>
        </div>

        <div class="flex items-center justify-end pt-2 border-t border-slate-800/80">
            <button type="button" @click="closeUploadDockModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-colors">Close</button>
        </div>
    </div>
</div>
{{ end }}

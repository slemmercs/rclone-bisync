{{/* Operational Pattern 1: Health Banner */}}
{{ define "pattern_health_banner" }}
<div class="ds-card mb-6">
    <div class="ds-card-body p-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <span class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" :class="telemetry.daemon_health?.status === 'healthy' ? 'bg-emerald-400' : 'bg-rose-400'"></span>
                <span class="relative inline-flex rounded-full h-3 w-3" :class="telemetry.daemon_health?.status === 'healthy' ? 'bg-emerald-500' : 'bg-rose-500'"></span>
            </span>
            <div>
                <div class="flex items-center gap-2">
                    <span class="text-sm font-bold text-white tracking-wide">Sync Engine Fleet</span>
                    <span class="ds-badge" :class="getStatusBadgeClass(activeProfileEngineStatus)" x-text="normalizeStatus(activeProfileEngineStatus)"></span>
                </div>
                <div class="text-[11px] text-slate-400 font-mono mt-0.5" x-text="'Latency: ' + (daemonLatencyText !== '--' ? daemonLatencyText + 'ms' : '-- ms')"></div>
            </div>
        </div>

        <div class="flex items-center gap-4 text-xs font-mono">
            <div class="flex items-center gap-1.5 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                <span class="text-slate-500 uppercase text-[9px] font-bold">Healthy:</span>
                <span class="text-emerald-400 font-bold tabular-nums" x-text="fleetSummary.healthyCount"></span>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                <span class="text-slate-500 uppercase text-[9px] font-bold">Warning:</span>
                <span class="text-amber-400 font-bold tabular-nums" x-text="fleetSummary.warningCount"></span>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                <span class="text-slate-500 uppercase text-[9px] font-bold">Critical:</span>
                <span class="text-rose-400 font-bold tabular-nums" x-text="fleetSummary.criticalCount"></span>
            </div>
        </div>
    </div>
</div>
{{ end }}

{{/* Operational Pattern 2: Live Sync Summary */}}
{{ define "pattern_sync_summary" }}
<div x-show="telemetry.is_syncing && liveTransferStats" x-cloak class="ds-alert ds-alert-info mb-6 items-center justify-between">
    <div class="flex items-center gap-3">
        <svg class="w-5 h-5 text-indigo-400 animate-spin shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <div>
            <div class="text-xs font-bold text-white flex items-center gap-2">
                <span>Active Synchronization in Progress</span>
                <span class="ds-badge ds-badge-running">RUNNING</span>
            </div>
            <div class="text-[11px] text-indigo-200/80 font-mono mt-0.5 tabular-nums">
                <span x-text="liveTransferStats.speed_str"></span>
                <span>•</span>
                <span x-text="liveTransferStats.bytes_str + ' / ' + liveTransferStats.total_bytes_str"></span>
                <template x-if="liveTransferStats.eta_str">
                    <span>• ETA: <span x-text="liveTransferStats.eta_str"></span></span>
                </template>
            </div>
        </div>
    </div>
    <div class="text-right font-mono text-sm font-bold text-white tabular-nums" x-text="liveTransferStats.percentage.toFixed(1) + '%'"></div>
</div>
{{ end }}

{{ define "toast" }}
    <!-- Global Notification Toast -->
    <div x-show="toast.show" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-2" class="fixed bottom-5 right-5 z-50 max-w-sm rounded-xl p-3.5 shadow-2xl border text-xs font-medium flex items-center gap-3 backdrop-blur-md" :class="toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-700/60' : (toast.type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-700/60' : 'bg-slate-900/90 text-slate-200 border-slate-700/60')">
        <span class="w-2 h-2 rounded-full shrink-0" :class="toast.type === 'success' ? 'bg-emerald-400' : (toast.type === 'error' ? 'bg-rose-400' : 'bg-indigo-400')"></span>
        <span class="flex-1" x-text="toast.message"></span>
        <button @click="toast.show = false" class="text-slate-400 hover:text-white p-0.5 rounded transition-colors">
            <svg class="w-3.5 h-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </div>
{{ end }}

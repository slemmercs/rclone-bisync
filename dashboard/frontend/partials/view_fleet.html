{{ define "view_fleet" }}
<!-- Level 1: Fleet View -->
<div x-show="currentTab === 'fleet'" x-cloak class="space-y-6">

    <!-- Fleet Health Summary Banner -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl shadow-slate-950/20 backdrop-blur-sm">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 mb-4 border-b border-slate-800/80">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 shrink-0">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                </div>
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-200">Fleet Health Overview</h2>
                    <p class="text-[11px] text-slate-400">Aggregate multi-workload synchronization health and real-time runner statuses</p>
                </div>
            </div>
            <button @click="startNewProfile()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 self-start sm:self-auto transition-colors shadow-sm shadow-indigo-950">
                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>New Profile</span>
            </button>
        </div>

        <!-- Filterable Summary Badges -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
            <button @click="fleetFilter = 'all'" :class="fleetFilter === 'all' ? 'ring-2 ring-indigo-500 bg-slate-800/90' : 'bg-slate-950/60 hover:bg-slate-800/50'" class="p-3 rounded-xl border border-slate-800/80 transition-all text-left flex flex-col justify-between">
                <div class="text-[10px] font-mono uppercase text-slate-400 tracking-wider">Total Profiles</div>
                <div class="text-xl font-bold font-mono text-white mt-1" x-text="fleetSummary.total">0</div>
            </button>
            <button @click="fleetFilter = 'healthy'" :class="fleetFilter === 'healthy' ? 'ring-2 ring-emerald-500 bg-emerald-950/20' : 'bg-slate-950/60 hover:bg-slate-800/50'" class="p-3 rounded-xl border border-slate-800/80 transition-all text-left flex flex-col justify-between">
                <div class="text-[10px] font-mono uppercase text-emerald-400 tracking-wider flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    <span>Healthy</span>
                </div>
                <div class="text-xl font-bold font-mono text-emerald-300 mt-1" x-text="fleetSummary.healthy">0</div>
            </button>
            <button @click="fleetFilter = 'review'" :class="fleetFilter === 'review' ? 'ring-2 ring-amber-500 bg-amber-950/20' : 'bg-slate-950/60 hover:bg-slate-800/50'" class="p-3 rounded-xl border border-slate-800/80 transition-all text-left flex flex-col justify-between">
                <div class="text-[10px] font-mono uppercase text-amber-400 tracking-wider flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                    <span>Needs Review</span>
                </div>
                <div class="text-xl font-bold font-mono text-amber-300 mt-1" x-text="fleetSummary.review">0</div>
            </button>
            <button @click="fleetFilter = 'failing'" :class="fleetFilter === 'failing' ? 'ring-2 ring-rose-500 bg-rose-950/20' : 'bg-slate-950/60 hover:bg-slate-800/50'" class="p-3 rounded-xl border border-slate-800/80 transition-all text-left flex flex-col justify-between">
                <div class="text-[10px] font-mono uppercase text-rose-400 tracking-wider flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
                    <span>Failing</span>
                </div>
                <div class="text-xl font-bold font-mono text-rose-300 mt-1" x-text="fleetSummary.failing">0</div>
            </button>
            <button @click="fleetFilter = 'syncing'" :class="fleetFilter === 'syncing' ? 'ring-2 ring-sky-500 bg-sky-950/20' : 'bg-slate-950/60 hover:bg-slate-800/50'" class="p-3 rounded-xl border border-slate-800/80 col-span-2 sm:col-span-1 transition-all text-left flex flex-col justify-between">
                <div class="text-[10px] font-mono uppercase text-sky-400 tracking-wider flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
                    <span>Syncing</span>
                </div>
                <div class="text-xl font-bold font-mono text-sky-300 mt-1" x-text="fleetSummary.syncing">0</div>

    <!-- Search, Sort & Filter Bar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
        <div class="relative flex-1 max-w-md">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="text" x-model="fleetSearch" placeholder="Filter profiles by name, remote, or path..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
            <button x-show="fleetSearch" @click="fleetSearch = ''" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300">
                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-400">Sort:</span>
            <select x-model="fleetSort" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                <option value="status">Health Status</option>
                <option value="name">Profile Name</option>
                <option value="last_run">Last Execution</option>
            </select>
        </div>
    </div>

    <!-- Profile Tile Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="p in filteredProfiles" :key="p.id">
            <div @click="openProfileWorkspace(p.id)" class="bg-slate-900 border border-slate-800 hover:border-indigo-500/60 rounded-2xl p-5 shadow-lg shadow-slate-950/20 cursor-pointer transition-all hover:shadow-indigo-950/20 hover:-translate-y-0.5 group flex flex-col justify-between space-y-4">
                
                <!-- Tile Header -->
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <div class="flex items-center gap-2">
                            <h3 class="text-sm font-bold text-white group-hover:text-indigo-400 transition-colors truncate" x-text="p.name"></h3>
                            <span x-show="profilesData.activeId === p.id" class="text-[9px] px-1.5 py-0.2 rounded font-mono font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 uppercase shrink-0">Active</span>
                        </div>
                        <div class="text-[11px] font-mono text-slate-500 truncate" x-text="p.id"></div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider border flex items-center gap-1" :class="getProfileStatusBadgeClass(p)">
                            <span class="w-1.5 h-1.5 rounded-full" :class="getProfileStatusDotClass(p)"></span>
                            <span x-text="getProfileStatusText(p)"></span>
                        </span>
                    </div>
                </div>

                <!-- Topology Preview -->
                <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-3 space-y-2 font-mono text-[11px]">
                    <div class="flex items-center gap-2 text-slate-400">
                        <svg class="w-3.5 h-3.5 text-slate-500 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        <span class="text-slate-500 shrink-0">Local:</span>
                        <span class="text-slate-300 truncate" :title="p.local_path" x-text="p.local_path || '--'"></span>
                    </div>
                    <div class="flex items-center gap-2 text-slate-400">
                        <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                        <span class="text-slate-500 shrink-0">Target:</span>
                        <span class="text-emerald-400 truncate" :title="p.remote + (p.remote_path ? ':' + p.remote_path : '')" x-text="p.remote ? (p.remote + (p.remote_path ? ':' + p.remote_path : '')) : '--'"></span>
                    </div>
                </div>

            </button>
        </div>
    </div>

                <!-- Operational Telemetry Info -->
                <div class="grid grid-cols-2 gap-2 text-[11px] font-mono border-t border-slate-800/80 pt-3 text-slate-400">
                    <div>
                        <div class="text-[10px] text-slate-500 uppercase">Last Run</div>
                        <div class="text-slate-300 truncate font-semibold" x-text="formatProfileLastRun(p)">Never</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-500 uppercase">Schedule</div>
                        <div class="text-slate-300 truncate font-semibold" x-text="p.schedule ? (p.schedule === 'manual' ? 'Manual (On-Demand)' : p.schedule + ' Auto') : 'Manual'"></div>
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-800/60" @click.stop>
                    <div class="flex items-center gap-1.5">
                        <button @click="triggerProfileSync(p.id, false)" :disabled="isProfileSyncing(p)" class="px-2.5 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors disabled:opacity-50">
                            <svg x-show="isProfileSyncing(p)" class="w-3 h-3 animate-spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                            <svg x-show="!isProfileSyncing(p)" class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                            <span x-text="isProfileSyncing(p) ? 'Syncing...' : 'Sync Now'"></span>
                        </button>
                        <button @click="triggerProfileSync(p.id, true)" :disabled="isProfileSyncing(p)" class="px-2 py-1 bg-sky-500/10 hover:bg-sky-500/20 text-sky-300 border border-sky-500/30 rounded-lg text-xs font-medium transition-colors disabled:opacity-50" title="Simulate bidirectional sync (dry run)">
                            Dry Run
                        </button>
                    </div>

                    <div class="flex items-center gap-1">
                        <button @click="startEditProfile(p)" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors" title="Edit Profile & Operational Flags">
                            <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                        <button @click="openProfileWorkspace(p.id)" class="p-1.5 text-indigo-400 hover:text-indigo-300 rounded-lg hover:bg-slate-800 transition-colors" title="Open Scoped Workspace">
                            <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>

            </div>
        </template>
    </div>

    <!-- Empty State -->
    <div x-show="filteredProfiles.length === 0" class="text-center py-12 bg-slate-900/40 border border-slate-800/80 rounded-2xl p-8">
        <div class="w-12 h-12 rounded-2xl bg-slate-800/60 flex items-center justify-center text-slate-500 mx-auto mb-3">
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <h4 class="text-sm font-semibold text-slate-300">No matching profiles found</h4>
        <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Try clearing your search query or status filter, or create a new synchronization profile.</p>
        <button @click="fleetFilter = 'all'; fleetSearch = '';" x-show="fleetFilter !== 'all' || fleetSearch" class="mt-3 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-colors">
            Reset Filters
        </button>
    </div>

</div>
{{ end }}

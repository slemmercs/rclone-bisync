{{ define "view_remotes" }}
        <!-- View 2: Remote Storage Manager -->
        <div x-show="currentTab === 'remotes'" x-cloak x-transition.opacity.duration.200ms class="space-y-6">
            <!-- Global Capacity Overview Cards -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 flex flex-col justify-between">
                    <div class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Total Cloud Space</div>
                    <div class="text-xl sm:text-2xl font-bold text-white mt-2 font-mono" x-text="formatBytes(remotesData.summary?.total_capacity_bytes)"></div>
                    <div class="text-[10px] text-slate-500 mt-1">Aggregated across all remotes</div>
                </div>
                <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 flex flex-col justify-between">
                    <div class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Utilized Storage</div>
                    <div class="text-xl sm:text-2xl font-bold text-indigo-400 mt-2 font-mono" x-text="formatBytes(remotesData.summary?.total_used_bytes)"></div>
                    <div class="text-[10px] text-indigo-300/80 mt-1" x-text="`${getQuotaPct(remotesData.summary?.total_used_bytes, remotesData.summary?.total_capacity_bytes).toFixed(1)}% total quota used`"></div>
                </div>
                <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 flex flex-col justify-between">
                    <div class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Available Space</div>
                    <div class="text-xl sm:text-2xl font-bold text-emerald-400 mt-2 font-mono" x-text="formatBytes(remotesData.summary?.total_free_bytes)"></div>
                    <div class="text-[10px] text-emerald-500/80 mt-1">Free remaining capacity</div>
                </div>
                <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 flex flex-col justify-between">
                    <div class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Configured Remotes</div>
                    <div class="text-xl sm:text-2xl font-bold text-white mt-2 font-mono" x-text="remotesData.count || 0"></div>
                    <div class="text-[10px] text-slate-500 mt-1" x-text="remotesData.last_checked ? `Checked ${remotesData.last_checked}` : 'Auto-discovered'"></div>
                </div>
            </div>

            <!-- Unified Storage Remotes & Authentication Deck -->
            <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-3">
                    <div class="p-2.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 shrink-0">
                        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-white text-sm">Configured Remotes</span>
                            <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700/60" x-text="remotesData.count || (remotesData.remotes?.length || 0)"></span>
                            <span x-show="remotesData.authSummary?.oauth_remotes > 0" class="text-[10px] font-mono font-normal px-1.5 py-0.5 rounded bg-indigo-950/60 text-indigo-300 border border-indigo-800/40" x-text="`${remotesData.authSummary?.oauth_remotes || 0} OAuth`"></span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 mt-1.5 text-[11px]">
                            <span class="px-2 py-0.5 rounded-full border flex items-center gap-1.5 font-medium bg-emerald-500/10 text-emerald-400 border-emerald-500/20">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                <span x-text="`${remotesData.authSummary?.connected || 0} Connected`"></span>
                            </span>
                            <span x-show="remotesData.authSummary?.migration_required > 0" class="px-2 py-0.5 rounded-full border flex items-center gap-1.5 font-medium bg-amber-500/10 text-amber-300 border-amber-500/20">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                                <span x-text="`${remotesData.authSummary?.migration_required} Migration Required`"></span>
                            </span>
                            <span x-show="remotesData.authSummary?.authorization_required > 0" class="px-2 py-0.5 rounded-full border flex items-center gap-1.5 font-medium bg-rose-500/10 text-rose-300 border-rose-500/20">
                                <span class="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span>
                                <span x-text="`${remotesData.authSummary?.authorization_required} Auth Required`"></span>
                            </span>
                            <span x-show="remotesData.authSummary?.errors > 0" class="px-2 py-0.5 rounded-full border flex items-center gap-1.5 font-medium bg-red-500/10 text-red-300 border-red-500/20">
                                <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>
                                <span x-text="`${remotesData.authSummary?.errors} Error`"></span>
                            </span>
                        </div>
                    </div>

                    <!-- Profile Scoping Inline Toggle -->
                    <template x-if="activeProfile && activeProfile.remote">
                        <div class="flex items-center gap-2 pl-3 border-l border-slate-800 font-mono">
                            <span class="text-slate-400 text-[11px] hidden sm:inline">Profile Scope:</span>
                            <button type="button" @click="remotesData.showAll = !remotesData.showAll" class="px-2.5 py-1 rounded-lg border text-xs font-semibold transition-colors flex items-center gap-1.5 cursor-pointer" :class="remotesData.showAll ? 'bg-slate-800/80 text-slate-300 border-slate-700/80 hover:text-white' : 'bg-indigo-600/20 border-indigo-500/40 text-indigo-300 font-bold'">
                                <svg class="w-3.5 h-3.5 text-emerald-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                                <span class="text-white" x-text="activeProfile ? activeProfile.remote : ''"></span>
                                <span class="text-[10px]" x-text="remotesData.showAll ? '(Showing All)' : '• Scoped'"></span>
                            </button>
                        </div>
                    </template>
                </div>

                <div class="flex items-center gap-2">
                    <button type="button" @click.stop="viewAuthAudit()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition-colors border border-slate-700/60 flex items-center gap-1.5 cursor-pointer">
                        <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span>Audit Log</span>
                    </button>
                    <div class="flex items-center rounded-lg border border-indigo-500/30 overflow-hidden bg-indigo-600/20">
                        <button type="button" @click.stop="checkAuthAndQuotas()" :disabled="isRemotesLoading()" class="px-3 py-1.5 hover:bg-indigo-600/30 text-indigo-300 text-xs font-medium transition-colors flex items-center gap-1.5 cursor-pointer disabled:opacity-50">
                            <svg class="w-3.5 h-3.5 shrink-0" :class="{ 'animate-spin': remotesData.loading }" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                            <span x-text="activeProfile && activeProfile.remote ? `Check ${activeProfile.remote} Quota` : 'Check Auth & Quotas'"></span>
                        </button>
                        <template x-if="activeProfile && activeProfile.remote">
                            <button type="button" @click.stop="checkAuthAndQuotas(null)" :disabled="isRemotesLoading()" class="px-2 py-1.5 border-l border-indigo-500/30 text-[11px] font-mono hover:bg-indigo-600/30 text-indigo-200" title="Check All Remotes">All</button>
                        </template>
                    </div>
                    <button type="button" @click="openCreateRemoteWizard()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-sm cursor-pointer">
                        <svg class="w-3.5 h-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        <span>Add Remote</span>
                    </button>
                </div>
            </div>

            <!-- Provider Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="remote in getDisplayedRemotes()" :key="remote.name">
                    <div class="bg-slate-900/60 border rounded-2xl p-5 flex flex-col justify-between transition-all hover:border-slate-700/80" :class="getProviderColor(remote.type).border">
                        <div>
                            <!-- Card Header (Option 2: Streamlined Header & Compact Metadata Strip) -->
                            <div class="flex items-start justify-between gap-3 mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="p-2.5 rounded-xl border flex items-center justify-center font-bold font-mono text-sm shrink-0" :class="`${getProviderColor(remote.type).bg} ${getProviderColor(remote.type).border} ${getProviderColor(remote.type).text}`">
                                        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                                    </div>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <h3 class="text-base font-bold text-white font-mono" x-text="remote.fs"></h3>
                                            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded border" :class="getProviderColor(remote.type).badge" x-text="remote.type_label"></span>
                                        </div>
                                        <!-- Unified Compact Metadata Strip -->
                                        <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mt-1 text-[11px] text-slate-400">
                                            <span>Backend: <span class="font-mono text-slate-300" x-text="remote.type"></span></span>
                                            <template x-if="remote.auth && remote.auth.is_oauth">
                                                <div class="flex items-center gap-2">
                                                    <span class="text-slate-600">•</span>
                                                    <span x-show="remote.auth.has_client_secret" class="inline-flex items-center gap-1 text-indigo-300 font-medium">
                                                        <svg class="w-3 h-3 shrink-0 text-indigo-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
                                                        <span>Personal App</span>
                                                    </span>
                                                    <span x-show="!remote.auth.has_client_secret" class="inline-flex items-center gap-1 font-medium" :class="remote.auth.status === 'migration_required' ? 'text-amber-400' : 'text-slate-400'">
                                                        <svg x-show="remote.auth.status === 'migration_required'" class="w-3.5 h-3.5 shrink-0 text-amber-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12.01" x2="12.01" y1="17" y2="17"/></svg>
                                                        <span>Shared App ID</span>
                                                    </span>
                                                </div>
                                            </template>
                                            <template x-if="remote.auth">
                                                <div class="flex items-center gap-2">
                                                    <span class="text-slate-600">•</span>
                                                    <span class="inline-flex items-center gap-1.5 font-medium" :class="getAuthBadge(remote.auth.status).textClass">
                                                        <span class="w-1.5 h-1.5 rounded-full" :class="getAuthBadge(remote.auth.status).dot"></span>
                                                        <span x-text="getAuthBadge(remote.auth.status).text"></span>
                                                    </span>
                                                </div>
                                            </template>
                                            <span class="text-slate-600">•</span>
                                            <span class="font-medium" :class="remote.about?.total ? 'text-slate-300' : 'text-slate-500'" x-text="remote.about?.total ? 'Quota Active' : 'No Quota API'"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="shrink-0 flex items-center">
                                    <span x-show="isRemoteActiveTarget(remote)" class="text-[9px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-md bg-emerald-950/80 text-emerald-300 border border-emerald-800/60 flex items-center gap-1 shadow-sm">
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                        <span>Active Target</span>
                                    </span>
                                </div>
                            </div>

                            <!-- Migration Recommended Alert Banner -->
                            <div x-show="remote.auth && remote.auth.status === 'migration_required'" class="mb-3 p-3 rounded-xl bg-amber-950/40 border border-amber-800/50 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2.5 text-xs text-amber-200">
                                <div class="flex items-center gap-2">
                                    <svg class="w-4 h-4 text-amber-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12.01" x2="12.01" y1="17" y2="17"/></svg>
                                    <span class="text-[11px] font-medium">Using shared Rclone Client ID. Migrate to personal OAuth credentials.</span>
                                </div>
                                <button @click="openMigrationWizard(remote)" class="px-2.5 py-1 text-[11px] font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 rounded transition-colors shrink-0 flex items-center gap-1 shadow-sm">
                                    <span>Migration Wizard</span>
                                    <svg class="w-3 h-3 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
                                </button>
                            </div>

                            <!-- Storage Quota Section -->
                            <div class="bg-slate-950/70 p-4 rounded-xl border border-slate-800/60 space-y-3">
                                <div class="flex justify-between items-baseline text-xs">
                                    <span class="text-slate-400 font-medium">Storage Allocation</span>
                                    <span class="font-mono text-white font-semibold" x-text="`${formatBytes(remote.about?.used)} / ${formatBytes(remote.about?.total)}`"></span>
                                </div>

                                <!-- Multi-segment Quota Bar -->
                                <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden flex border border-slate-800/80">
                                    <div class="transition-all duration-500" :class="getQuotaPct(remote.about?.used, remote.about?.total) > 90 ? 'bg-rose-500' : getProviderColor(remote.type).bar" :style="`width: ${getQuotaPct(remote.about?.used, remote.about?.total)}%`"></div>
                                    <div x-show="remote.about?.other" class="bg-purple-500/70 transition-all duration-500" :style="`width: ${getQuotaPct(remote.about?.other, remote.about?.total)}%`" title="Other Google Services / Shared"></div>
                                </div>

                                <!-- Quota Breakdown Metrics -->
                                <div class="grid grid-cols-3 gap-2 pt-1 text-[11px] font-mono border-t border-slate-900">
                                    <div>
                                        <span class="text-slate-500 block text-[9px] uppercase">Used Space</span>
                                        <span class="text-slate-200 font-medium" x-text="`${formatBytes(remote.about?.used)} (${getQuotaPct(remote.about?.used, remote.about?.total).toFixed(1)}%)`"></span>
                                    </div>
                                    <div>
                                        <span class="text-slate-500 block text-[9px] uppercase">Free Remaining</span>
                                        <span class="text-emerald-400 font-medium" x-text="formatBytes(remote.about?.free)"></span>
                                    </div>
                                    <div>
                                        <span class="text-slate-500 block text-[9px] uppercase">Trash Bin</span>
                                        <span class="text-amber-400 font-medium" x-text="formatBytes(remote.about?.trashed)"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Card Action Footer -->
                        <div class="mt-4 pt-3 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2 text-xs">
                            <div class="flex items-center gap-1.5">
                                <template x-if="remote.auth && remote.auth.is_oauth">
                                    <div>
                                        <button x-show="!remotesData.reconnecting || !remotesData.reconnecting[remote.name]" @click="reconnectRemote(remote.name)" class="px-2.5 py-1 text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 rounded border border-slate-700/60 transition-colors flex items-center gap-1 font-medium">
                                            <span>Reconnect</span>
                                        </button>
                                        <button x-show="remotesData.reconnecting && remotesData.reconnecting[remote.name]" @click="cancelReconnect(remote.name)" class="px-2.5 py-1 text-[11px] bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 rounded border border-amber-500/30 transition-colors flex items-center gap-1.5 font-medium" title="Authorization flow in progress. Click to cancel.">
                                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                                            <span>Authorizing... (Cancel)</span>
                                        </button>
                                    </div>
                                </template>
                                <button type="button" @click.stop="validateRemote(remote.name)" :disabled="isRemoteValidating(remote)" class="px-2.5 py-1 text-[11px] bg-slate-950 hover:bg-slate-800 text-slate-300 rounded border border-slate-800 transition-colors flex items-center gap-1.5 cursor-pointer disabled:opacity-50">
                                    <svg x-show="remotesData.validating && remotesData.validating[remote.name]" class="w-3 h-3 animate-spin text-emerald-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                                    <svg x-show="remotesData.validated && remotesData.validated[remote.name]" class="w-3 h-3 text-emerald-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                                    <span :class="(remotesData.validated && remotesData.validated[remote.name]) ? 'text-emerald-400 font-medium' : ''" x-text="(remotesData.validating && remotesData.validating[remote.name]) ? 'Validating...' : ((remotesData.validated && remotesData.validated[remote.name]) ? 'Connected ✓' : 'Validate')"></span>
                                </button>
                                <template x-if="remote.auth && remote.auth.is_oauth">
                                    <button type="button" @click.stop="openMigrationWizard(remote)" class="px-2.5 py-1 text-[11px] bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 rounded border border-indigo-500/30 transition-colors flex items-center gap-1 cursor-pointer" title="Configure personal OAuth client ID and secret">
                                        <svg class="w-3 h-3 shrink-0 text-indigo-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
                                        <span>App Credentials</span>
                                    </button>
                                </template>
                            </div>
                            <div class="flex items-center gap-2">
                                <button type="button" @click.stop="openDedupeModal(remote.name)" class="px-2.5 py-1 text-[11px] bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 rounded border border-amber-500/30 transition-colors flex items-center gap-1.5 font-medium cursor-pointer" title="Safely remove duplicate files with matching MD5 hashes">
                                    <svg class="w-3 h-3 text-amber-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
                                    <span>Dedupe</span>
                                </button>
                                <button @click="openRemoteInExplorer(remote.name)" class="px-2.5 py-1 text-[11px] bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 rounded border border-indigo-500/30 transition-colors flex items-center gap-1.5 font-medium">
                                    <svg class="w-3.5 h-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                                    <span>Browse Files</span>
                                    <svg class="w-3 h-3 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
                                </button>
                                <button @click="viewSyncForRemote(remote.name)" class="px-2.5 py-1 text-[11px] bg-slate-950 hover:bg-slate-800 text-slate-400 rounded border border-slate-800 transition-colors">View Sync</button>
                                <button type="button" @click.stop="confirmDeleteRemote(remote.name)" class="p-1 text-slate-500 hover:text-rose-400 rounded transition-colors cursor-pointer" title="Delete Remote">
                                    <svg class="w-3.5 h-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Empty State -->
                <div x-show="remotesData.remotes.length === 0 && !remotesData.loading" class="col-span-full bg-slate-900/40 border border-slate-800/60 rounded-2xl p-8 text-center text-slate-500 space-y-3">
                    <svg class="w-10 h-10 mx-auto text-slate-600 mb-2 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 4 14.9h15.22"/><path d="M21.6 15.6A4.5 4.5 0 0 0 17.5 8h-1.8a7 7 0 0 0-8.8-3.7"/></svg>
                    <div>
                        <p class="text-sm text-slate-400 font-medium">No Rclone remotes discovered.</p>
                        <p class="text-xs text-slate-500 mt-1">Configure your first cloud storage target with the guided provisioning wizard.</p>
                    </div>
                    <button type="button" @click="openCreateRemoteWizard()" class="inline-flex items-center gap-1.5 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-md transition-colors cursor-pointer">
                        <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        <span>Add Remote Storage</span>
                    </button>
                </div>
            </div>
        </div> <!-- End View 2: Remote Storage Manager -->
{{ end }}

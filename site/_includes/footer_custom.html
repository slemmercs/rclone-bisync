<div id="image-lightbox" class="lightbox-overlay" aria-hidden="true" style="display: none;">
  <div class="lightbox-backdrop"></div>
  <div class="lightbox-container">
    <button class="lightbox-close" type="button" aria-label="Close enlarged preview">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <img class="lightbox-img" src="" alt="" />
    <div class="lightbox-caption"></div>
  </div>
</div>

<script>
(function() {
  function initLightbox() {
    var lightbox = document.getElementById('image-lightbox');
    if (!lightbox) return;
    var imgEl = lightbox.querySelector('.lightbox-img');
    var captionEl = lightbox.querySelector('.lightbox-caption');
    var closeBtn = lightbox.querySelector('.lightbox-close');
    var backdrop = lightbox.querySelector('.lightbox-backdrop');

    function open(src, alt, caption) {
      imgEl.src = src;
      imgEl.alt = alt || '';
      captionEl.textContent = caption || alt || '';
      lightbox.style.display = 'flex';
      document.body.classList.add('lightbox-open');
      requestAnimationFrame(function() {
        lightbox.classList.add('visible');
      });
    }

    function close() {
      lightbox.classList.remove('visible');
      document.body.classList.remove('lightbox-open');
      setTimeout(function() {
        lightbox.style.display = 'none';
        imgEl.src = '';
      }, 200);
    }

    closeBtn.addEventListener('click', close);
    backdrop.addEventListener('click', close);
    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox) close();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && lightbox.classList.contains('visible')) {
        close();
      }
    });

    /* Attach click listeners to all screenshots */
    var targets = document.querySelectorAll('.screenshot-frame img, .main-content img:not(.no-lightbox)');
    targets.forEach(function(img) {
      if (img.closest('#image-lightbox') || img.classList.contains('site-logo') || img.src.includes('avatar') || img.src.includes('badge')) {
        return;
      }
      img.classList.add('lightbox-target');
      img.addEventListener('click', function() {
        var frame = img.closest('.screenshot-frame');
        var caption = '';
        if (frame) {
          var cap = frame.querySelector('.caption');
          if (cap) caption = cap.innerText.replace(/\s+/g, ' ').trim();
        }
        open(img.src, img.alt, caption);
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLightbox);
  } else {
    initLightbox();
  }
})();
</script>
